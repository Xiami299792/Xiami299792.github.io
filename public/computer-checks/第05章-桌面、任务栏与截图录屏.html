<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>第 5 章 桌面、任务栏与截图录屏 · 电脑应用基础教程</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  /* 暖纸 + 铁锈强调 + 米色机壳：与实体机同一套色 */
  --bg:#f4efe4; --card:#fffdf7; --fg:#221d15; --mut:#7c7364; --line:#e3dac6;
  --accent:#9c4710; --accent-soft:#f6e9da; --accent-ink:#6d3009;
  --ok:#2e6b34; --ok-bg:#eaf3ea; --no:#a32a20; --no-bg:#fbece9; --warn:#8a5a00; --warn-bg:#fbf2dc;
  --key:#fbfcfd; --key-b:#d5dbe2; --shadow:0 1px 2px rgba(60,45,20,.07),0 6px 18px rgba(60,45,20,.07);
  --r:10px;
  --ku:33px; --case:#ded5c0; --case-hi:#f4eddd; --case-lo:#a89e86; --case-edge:#8b8269;
  /* 系统自带字体：宋体做题名，等宽做机打标签 */
  --serif:"Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  --mono:"Cascadia Mono","Consolas","Sarasa Mono SC","Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15120d; --card:#1e1a13; --fg:#ece5d6; --mut:#a2988a; --line:#332c20;
    --accent:#e0913f; --accent-soft:#2c2116; --accent-ink:#f0b273;
    --ok:#8ad08a; --ok-bg:#16251a; --no:#f0918c; --no-bg:#301715; --warn:#e5b06a; --warn-bg:#2e230f;
    --key:#252b31; --key-b:#3a424b; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--fg);
  background:
    radial-gradient(120% 80% at 50% -10%,rgba(156,71,16,.055),transparent 60%),
    repeating-linear-gradient(0deg,rgba(120,95,55,.035) 0 1px,transparent 1px 4px),
    var(--bg);
  font:15px/1.75 var(--sans);
  padding-bottom:44px;
}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
a{color:var(--accent)}
.hidden{display:none!important}

/* 页面入场：一次完整的编排，不再散落 */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top .wrap,.tabs,.lead,.tasks{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
#quiz .q{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
#quiz .q:nth-child(1){animation-delay:.05s}#quiz .q:nth-child(2){animation-delay:.09s}
#quiz .q:nth-child(3){animation-delay:.13s}#quiz .q:nth-child(4){animation-delay:.17s}
#quiz .q:nth-child(5){animation-delay:.21s}#quiz .q:nth-child(6){animation-delay:.25s}
#quiz .q:nth-child(7){animation-delay:.29s}#quiz .q:nth-child(8){animation-delay:.33s}
#quiz .q:nth-child(9){animation-delay:.37s}#quiz .q:nth-child(10){animation-delay:.41s}
.rig{animation:rise .6s cubic-bezier(.2,.7,.3,1) .12s both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- 顶栏 ---------- */
.top{background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 0 12px;position:sticky;top:0;z-index:50}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--accent),rgba(156,71,16,0) 70%)}
.top .wrap{display:flex;flex-direction:column;gap:6px}
.back{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--mut);align-self:flex-start}
.back:hover{color:var(--accent)}
.top h1{margin:0;font-family:var(--serif);font-size:23px;line-height:1.4;font-weight:700;letter-spacing:.01em}
.top .sub{margin:0;font-size:13px;color:var(--mut)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{font-family:var(--mono);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}

/* ---------- 标签页 ---------- */
.tabs{display:flex;gap:6px;padding-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{
  flex:0 0 auto;font:inherit;font-size:14px;padding:8px 18px;border-radius:8px 8px 0 0;
  border:1px solid var(--line);border-bottom:0;background:rgba(255,253,247,.6);color:var(--mut);cursor:pointer
}
.tabs button[aria-selected=true]{background:var(--card);border-color:var(--accent);color:var(--accent);
  font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}

main{padding-top:14px}
section.tabpane{display:flex;flex-direction:column;gap:12px}
.lead{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;
  padding:12px 15px;font-size:14px;line-height:1.85;color:var(--fg)}
.lead b{color:var(--accent-ink)}

/* ---------- 题目卡片 ---------- */
.q{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 15px 14px 17px;box-shadow:var(--shadow)}
.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r) 0 0 var(--r);
  background:var(--line)}
.q.done::before{background:transparent}
.q.ok{background:var(--ok-bg)} .q.ok::before{background:var(--ok)}
.q.no{background:var(--no-bg)} .q.no::before{background:var(--no)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qn{flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
    font-family:var(--mono);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.q.ok .qn{background:var(--ok);color:#fff}
.q.no .qn{background:var(--no);color:#fff}
.qt{font-size:15px;font-weight:600;line-height:1.65}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--mut);border:1px solid var(--line);
     border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;font-weight:400}

.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:14.5px;
  padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--fg);cursor:pointer;line-height:1.55;transition:border-color .12s,background .12s
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt i{flex:0 0 auto;font-style:normal;font-family:var(--mono);font-weight:700;color:var(--mut);min-width:15px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt[disabled]{cursor:default;opacity:.92}
.opt[disabled]:hover{background:var(--card)}
.opt.right:hover{background:var(--ok-bg)} .opt.wrong:hover{background:var(--no-bg)}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);
     background:var(--accent);color:#fff;cursor:pointer;transition:filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.inp{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
     background:var(--card);color:var(--fg);width:100%;max-width:320px}
.inp:focus{outline:0;border-color:var(--accent)}

.fb{margin-top:10px;font-size:14px;line-height:1.75;border-left:3px solid var(--accent);padding:2px 0 2px 10px;color:var(--fg)}
.q.ok .fb{border-color:var(--ok)}
.q.no .fb{border-color:var(--no)}
.fb em{font-style:normal;font-weight:700}
.fb.ok em{color:var(--ok)} .fb.no em{color:var(--no)}

.chips{display:flex;flex-direction:column;gap:7px}
.chip{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);
      border-radius:8px;background:var(--bg);cursor:pointer;font-size:14.5px;text-align:left;font:inherit;color:var(--fg)}
.chip b{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--fg);
        font-size:11.5px;display:flex;align-items:center;justify-content:center}
.chip.picked{border-color:var(--accent);background:var(--accent-soft)}
.chip.picked b{background:var(--accent);color:#fff}

.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:7px}
.mi{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
    font:inherit;font-size:14px;text-align:left;cursor:pointer;color:var(--fg);line-height:1.45}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.pair{border-color:var(--ok)}
.mi .dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:7px;
         font-size:10.5px;line-height:16px;text-align:center;background:var(--line);color:var(--fg);vertical-align:1px}
.mi.pair .dot{background:var(--ok);color:#fff}

.result{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--shadow)}
.result .big{font-family:var(--mono);font-size:32px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.result p{margin:6px 0 0;font-size:14px;color:var(--mut)}
.foot{margin-top:24px;font-family:var(--mono);font-size:12px;color:var(--mut);text-align:center;line-height:1.9;
  border-top:1px dashed var(--line);padding-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:14px 14px 13px;text-decoration:none;color:var(--fg);box-shadow:var(--shadow);
      transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.card .t{font-family:var(--serif);font-size:17px;font-weight:700;margin:4px 0 6px}
.card .d{font-size:13px;color:var(--mut);line-height:1.65}

/* ================================================================
   实体电脑：地下室工位
   ================================================================ */
.rig{
  position:relative;margin:14px 0 0;padding:16px 14px 6px;border-radius:14px;overflow:hidden;
  display:grid;gap:8px;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"mon" "desk" "kb";
  align-items:end;justify-items:center;
  background:linear-gradient(180deg,#1d1813,#262019 45%,#14100c);
}
.rig::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.024) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 78px);}
.rig .desk{grid-area:desk;width:100%;height:12px;position:relative}
.rig .desk::before{content:"";position:absolute;left:-14px;right:-14px;top:0;bottom:-36px;
  background:linear-gradient(180deg,#6f5433,#42301d 45%,#241a10)}
.rig .desk::after{content:"";position:absolute;left:-14px;right:-14px;top:12px;height:36px;
  background:linear-gradient(180deg,rgba(0,0,0,.38),transparent)}

/* ---------- 大头显示器 ---------- */
.mon{grid-area:mon;position:relative;width:100%;max-width:600px;z-index:2}
.crt{position:relative}
.crt .body{position:relative;border-radius:10px 10px 12px 12px;padding:12px 12px 0;
  border:1px solid var(--case-edge);
  background:linear-gradient(172deg,var(--case-hi),var(--case) 40%,#c6bca4 76%,var(--case-lo));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.72),inset 0 -4px 10px rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.5)}
.crt .tube{position:relative;padding:7px;border-radius:10px;background:#4c4738;
  box-shadow:inset 0 0 0 2px #2e2a21,inset 0 3px 12px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.4)}
.crt .glass-wrap{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:#05070a}
.scr{position:absolute;inset:0;overflow:hidden;color:#fff;
  background:
    radial-gradient(120% 90% at 50% 0%,#1a3a6e 0%,#12305e 30%,#0a2147 60%,#061733 100%);
  font:12px/1.45 "Segoe UI","Microsoft YaHei",sans-serif;user-select:none;touch-action:none}

/* 玻璃反光与扫描线 */
.glass{position:absolute;inset:0;z-index:70;pointer-events:none;border-radius:inherit;
  background:
    linear-gradient(104deg,rgba(255,255,255,.13) 0 14%,rgba(255,255,255,.03) 26%,transparent 40%),
    radial-gradient(125% 118% at 50% 46%,transparent 52%,rgba(0,0,0,.5) 100%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
  animation:crtflick 7s infinite}
@keyframes crtflick{0%,96%,100%{opacity:1}97%{opacity:.9}98%{opacity:1}99%{opacity:.94}}
.crt .chin{display:flex;align-items:center;gap:9px;padding:8px 4px 10px;color:#4a4436;font-size:10.5px}
.crt .chin .brand{font-weight:700;letter-spacing:.14em;font-size:11px}
.crt .chin .model{opacity:.7;letter-spacing:.04em}
.crt .chin .sp{flex:1}
.crt .chin .dial{width:20px;height:20px;border-radius:50%;border:1px solid var(--case-edge);
  background:radial-gradient(circle at 34% 30%,#fdfaf2,#c8bfa7);box-shadow:inset 0 -2px 3px rgba(0,0,0,.18);
  font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5b5342}
.crt .chin .dial:hover{background:radial-gradient(circle at 34% 30%,#fff,#d7cfb9)}
.crt .chin .led{width:9px;height:9px;border-radius:50%;background:#4a3a2a;box-shadow:inset 0 0 3px #000}
.crt .chin .led.on{background:#6ee36e;box-shadow:0 0 9px #58d858,inset 0 0 2px #0a3a0a}
.crt .chin .led.wait{background:#e0a63a;box-shadow:0 0 9px #d8961f}
.crt .stand{position:relative;height:15px;margin:0 auto;width:34%;
  background:linear-gradient(180deg,#b3a98f,#8e8570);
  clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.crt .base{position:relative;height:11px;margin:0 auto;width:64%;border-radius:5px 5px 10px 10px;
  background:linear-gradient(180deg,var(--case-hi),var(--case-lo));
  box-shadow:0 12px 24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5)}

/* ---------- 实体键盘 ---------- */
.kbwrap2{grid-area:kb;width:fit-content;max-width:100%;margin:0 auto;z-index:3}
.kbwrap2 .kbbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:7px;justify-content:center}
.kbwrap2 .kbbar .btn{padding:5px 11px;font-size:12px}
.kbwrap2 .kbbar label{font-size:11.5px;color:#a99b83;display:flex;gap:5px;align-items:center;cursor:pointer}
.kbwrap2 .target{font-size:12.5px;padding:7px 11px;border-radius:7px;background:rgba(124,192,255,.14);
  color:#cfe3f8;margin-bottom:7px;text-align:center;border:1px solid rgba(124,192,255,.28)}
.kbwrap2 .target b{color:#8fc6ff}
.kb2{display:flex;gap:9px;overflow-x:auto;padding:8px 9px 9px;border-radius:7px 7px 11px 11px;
  border:1px solid var(--case-edge);
  background:linear-gradient(180deg,#e8e1cf,#cec5af 58%,#b5ab93);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.68),inset 0 -3px 7px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.45)}
.kbblk{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.kbrow{display:flex;gap:4px}
.kk{flex:0 0 auto;height:29px;min-width:var(--ku);padding:0 5px;border-radius:5px;border:1px solid #9d9479;
  background:linear-gradient(180deg,#fdfbf4,#e5dfcf);color:#3a3428;font:inherit;font-size:10.5px;line-height:1.05;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  box-shadow:0 2px 0 #a89e88,inset 0 1px 0 #fff;user-select:none}
.kk small{font-size:8px;color:#8b8270;line-height:1}
.kk:hover{background:linear-gradient(180deg,#fff,#ece6d7)}
.kk.on{background:linear-gradient(180deg,#3f6b9c,#2b4f78);color:#fff;border-color:#223f60;
  box-shadow:0 2px 0 #1d3550,inset 0 1px 0 rgba(255,255,255,.25)}
.kk.on small{color:#cfe0f0}
.kk.hit{transform:translateY(2px);box-shadow:none}
.kk.tall{height:62px}
.kk.gap{visibility:hidden}
.kk.wide{min-width:calc(var(--ku)*1.5)}
.kinfo{font-size:12.5px;color:#a99b83;min-height:34px;margin-top:7px;text-align:center}
.kinfo b{color:#e8dcc4}
.kinfo .combo{color:#8fc6ff;font-weight:700}

/* ================================================================
   屏内 Windows 界面
   ================================================================ */
.scr .dicons{position:absolute;top:8px;left:6px;display:flex;flex-direction:column;gap:3px;width:66px}
.scr .dicon{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 1px;border-radius:5px;
  cursor:pointer;text-align:center;line-height:1.2;font-size:9.5px;text-shadow:0 1px 3px rgba(0,0,0,.85);
  border:1px solid transparent;color:#fff}
.scr .dicon span{font-size:19px;line-height:1}
.scr .dicon:hover{background:rgba(255,255,255,.16)}
.scr .dicon.sel{background:rgba(96,165,250,.36);border-color:rgba(147,197,253,.8)}

.scr .win{position:absolute;background:#f6f6f6;border:1px solid rgba(0,0,0,.4);border-radius:7px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 14px 32px rgba(0,0,0,.62);min-width:130px;min-height:92px;color:#1b1b1b}
.scr .win .tb{display:flex;align-items:center;gap:5px;padding:0 3px 0 8px;height:26px;flex:0 0 26px;
  background:linear-gradient(180deg,#2f6398,#24507d);color:#fff;font-size:11px;cursor:grab;touch-action:none}
.scr .win.blur .tb{background:linear-gradient(180deg,#5b6672,#4a545e);color:#e6e9ec}
.scr .win .tb .ic{font-size:11px}
.scr .win .tb .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scr .win .tb button{width:24px;height:19px;border:0;border-radius:4px;background:transparent;color:#fff;
  font-size:10px;line-height:1;cursor:pointer;font-family:inherit}
.scr .win .tb button:hover{background:rgba(255,255,255,.22)}
.scr .win .tb button.x:hover{background:#c0392b}
.scr .win .bd{flex:1;overflow:auto;background:#fff;color:#1b1b1b;font-size:11.5px;position:relative}
.scr .win.min{display:none}
.scr .win .rs{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 46%,#b9c0c8 46%,#b9c0c8 56%,transparent 56%)}

/* 任务栏 */
.scr .tb2{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:3px;padding:0 5px;
  background:rgba(18,24,33,.86);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1)}
.scr .tb2 .sb{display:flex;align-items:center;gap:5px;height:26px;padding:0 7px;border:0;border-radius:5px;
  background:transparent;color:#fff;font:inherit;font-size:11px;cursor:pointer}
.scr .tb2 .sb:hover{background:rgba(255,255,255,.16)}
.scr .tb2 .sb .logo{display:grid;grid-template-columns:1fr 1fr;gap:1px;width:12px;height:12px}
.scr .tb2 .sb .logo i{background:#7cc0ff;border-radius:1px}
.scr .tb2 .find{width:88px;height:24px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.1);color:#cdd6e0;font:inherit;font-size:10.5px;padding:0 9px;outline:0}
.scr .tb2 .pi{position:relative;width:32px;height:26px;border:0;border-radius:5px;background:transparent;
  color:#fff;font-size:14px;cursor:pointer}
.scr .tb2 .pi:hover{background:rgba(255,255,255,.16)}
.scr .tb2 .pi.run::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;
  border-radius:2px;background:#7cc0ff}
.scr .tb2 .pins2{display:flex;align-items:center;gap:2px;padding:0 4px}
.scr .tb2 .sp{flex:1}

var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var shuf=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;
  var t=a[i];a[i]=a[j];a[j]=t;}return a;};
var norm=function(s){return String(s).toLowerCase().
  replace(/[\s，。、；：！？「」（）()【】\[\],.;:!?'"\/\\-]/g,'');};
var LET='ABCDEFGH';

/* ============ 计分 ============ */
var SC={total:0,ok:0,done:0};
function syncStat(){
  var bar=$('#pbar'), st=$('#stat');
  if(bar) bar.style.width=(SC.total?SC.done/SC.total*100:0)+'%';
  if(st) st.textContent='已答 '+SC.done+' / '+SC.total+'　正确 '+SC.ok;
  var r=$('#result');
  if(r){
    var pct=SC.total?Math.round(SC.ok/SC.total*100):0;
    r.innerHTML='<div class="big">'+SC.ok+' / '+SC.total+'</div><p>'+(SC.done<SC.total
      ? '还有 '+(SC.total-SC.done)+' 题未作答'
      : (pct>=90?'全部作答完毕，掌握情况良好':pct>=70?'大部分正确，回到错题对应的章节再看一遍':'建议重新阅读本章后重做'))+'</p>';
  }
}

/* ============ 题目卡片 ============ */
function qcard(q,i){
  var c=document.createElement('div');
  c.className='q'; c.dataset.i=i;
  var tag={single:'单选',multi:'多选',order:'排序',match:'配对',text:'填空'}[q.t]||'';
  c.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+esc(q.q)+
    '<span class="tag">'+tag+'</span></div></div>';
  var body=document.createElement('div');
  c.appendChild(body);
  ({single:mkSingle,multi:mkMulti,order:mkOrder,match:mkMatch,text:mkText})[q.t](c,body,q);
  return c;
}
function settle(card,ok,rightText,explain){
  if(card.classList.contains('done'))return;
  card.classList.add('done',ok?'ok':'no');
  SC.done++; if(ok)SC.ok++;
  var fb=document.createElement('div');
  fb.className='fb';
  fb.innerHTML=(ok?'<em class="ok">正确。</em> ':'<em class="no">不对。</em> ')+
    (rightText?'正确答案：'+esc(rightText)+'　':'')+esc(explain||'');
  card.appendChild(fb);
  if(!ok){
    var row=document.createElement('div'); row.className='row';
    var b=document.createElement('button'); b.className='btn ghost'; b.textContent='重做本题';
    b.onclick=function(){
      card.classList.remove('done','ok','no');
      $$('.fb,.row',card).forEach(function(x){x.remove();});
      $$('.opt,.chip,.mi',card).forEach(function(x){
        x.disabled=false;x.classList.remove('right','wrong','sel','picked','pair');});
      $$('.inp',card).forEach(function(x){x.value='';x.disabled=false;});
      if(card._reset)card._reset();
      SC.done--; syncStat();
    };
    row.appendChild(b); card.appendChild(row);
  }
  syncStat();
}

function mkSingle(card,body,q){
  var box=document.createElement('div'); box.className='opts';
  q.o.forEach(function(t,j){
    var b=document.createElement('button'); b.className='opt';
    b.innerHTML='<i>'+LET[j]+'</i><span>'+esc(t)+'</span>';
    b.onclick=function(){
      if(card.classList.contains('done'))return;
      $$('.opt',card).forEach(function(x,k){x.disabled=true; if(k===q.a)x.classList.add('right');});
      if(j!==q.a)b.classList.add('wrong');
      settle(card,j===q.a,q.o[q.a],q.e);
    };
    box.appendChild(b);
  });
  body.appendChild(box);
}

function mkMulti(card,body,q){
  var box=document.createElement('div'); box.className='opts'; var sel=[];
  q.o.forEach(function(t,j){
    var b=document.createElement('button'); b.className='opt';
    b.innerHTML='<i>'+LET[j]+'</i><span>'+esc(t)+'</span>';
    b.onclick=function(){ if(card.classList.contains('done'))return;
      var p=sel.indexOf(j);
      if(p>=0){sel.splice(p,1);b.classList.remove('sel');}else{sel.push(j);b.classList.add('sel');} };
    box.appendChild(b);
  });
  var row=document.createElement('div'); row.className='row';
  var sub=document.createElement('button'); sub.className='btn'; sub.textContent='提交答案';
  sub.onclick=function(){
    if(card.classList.contains('done'))return;
    var A=q.a.slice().sort().join(','), B=sel.slice().sort().join(',');
    $$('.opt',card).forEach(function(x,k){x.disabled=true;
      if(q.a.indexOf(k)>=0)x.classList.add('right'); else if(sel.indexOf(k)>=0)x.classList.add('wrong');});
    sub.disabled=true;
    settle(card,A===B,q.a.map(function(k){return LET[k];}).join('、'),q.e);
  };
  row.appendChild(sub); box.appendChild(row); body.appendChild(box);
}

function mkOrder(card,body,q){
  var items=shuf(q.items);
  var box=document.createElement('div'); box.className='chips'; var picked=[];
  var render=function(){
    box.innerHTML='';
    items.forEach(function(t,k){
      var pos=picked.indexOf(k);
      var b=document.createElement('button'); b.className='chip'+(pos>=0?' picked':'');
      b.innerHTML='<b>'+(pos>=0?pos+1:'')+'</b><span>'+esc(t)+'</span>';
      b.onclick=function(){ if(card.classList.contains('done'))return;
        var p=picked.indexOf(k);
        if(p>=0)picked.splice(p,1); else picked.push(k);
        render();
        if(picked.length===items.length){
          var ok=picked.every(function(v,idx){return items[v]===q.items[idx];});
          settle(card,ok,ok?'':'正确顺序：'+q.items.map(function(t,n){return (n+1)+'. '+t;}).join('　'),q.e);
        }
      };
      box.appendChild(b);
    });
  };
  render();
  card._reset=function(){picked.length=0;render();};
  body.appendChild(box);
  var tip=document.createElement('div'); tip.className='stat'; tip.style.marginTop='8px';
  tip.textContent='按正确顺序依次点击各项';
  body.appendChild(tip);
}

function mkMatch(card,body,q){
  var R=shuf(q.r);
  var box=document.createElement('div'); box.className='match';
  var L=document.createElement('div'); L.className='col';
  var Rc=document.createElement('div'); Rc.className='col';
  var cur=null, pair={};
  var paint=function(){
    $$('.mi',L).forEach(function(b,i){
      b.classList.toggle('sel',cur===i);
      b.classList.toggle('pair',pair[i]!==undefined);
      $('.dot',b).textContent=pair[i]!==undefined?(Object.keys(pair).indexOf(String(i))+1):'';
    });
    $$('.mi',Rc).forEach(function(b,j){
      var owner=Object.keys(pair).filter(function(k){return pair[k]===j;})[0];
      b.classList.toggle('pair',owner!==undefined);
      $('.dot',b).textContent=owner!==undefined?(Object.keys(pair).indexOf(owner)+1):'';
    });
  };
  q.l.forEach(function(t,i){
    var b=document.createElement('button'); b.className='mi';
    b.innerHTML='<span class="dot"></span>'+esc(t);
    b.onclick=function(){ if(card.classList.contains('done'))return; cur=i; paint(); };
    L.appendChild(b);
  });
  R.forEach(function(t,j){
    var b=document.createElement('button'); b.className='mi';
    b.innerHTML='<span class="dot"></span>'+esc(t);
    b.onclick=function(){ if(card.classList.contains('done')||cur===null)return;
      Object.keys(pair).forEach(function(k){if(pair[k]===j)delete pair[k];});
      pair[cur]=j; cur=null; paint();
      if(Object.keys(pair).length===q.l.length){
        var ok=q.l.every(function(_,i){return R[pair[i]]===q.r[i];});
        settle(card,ok,ok?'':'正确配对见下表',q.e);
      }
    };
    Rc.appendChild(b);
  });
  box.appendChild(L); box.appendChild(Rc); body.appendChild(box);
  var tip=document.createElement('div'); tip.className='stat'; tip.style.marginTop='8px';
  tip.textContent='先点左边一项，再点右边对应项';
  body.appendChild(tip);
  card._reset=function(){cur=null;Object.keys(pair).forEach(function(k){delete pair[k];});paint();};
}

function mkText(card,body,q){
  var row=document.createElement('div'); row.className='row';
  var inp=document.createElement('input'); inp.className='inp'; inp.placeholder=q.ph||'输入答案';
  var sub=document.createElement('button'); sub.className='btn'; sub.textContent='提交';
  var go=function(){
    if(card.classList.contains('done'))return;
    var v=norm(inp.value);
    var ok=q.a.some(function(x){return norm(x)===v;})||
           (q.contains&&q.contains.some(function(x){return v.indexOf(norm(x))>=0;}));
    inp.disabled=true; sub.disabled=true;
    settle(card,ok,q.a[0],q.e);
  };
  sub.onclick=go;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  row.appendChild(inp); row.appendChild(sub); body.appendChild(row);
}

function renderQuiz(list){
  var root=$('#quiz'); if(!root)return;
  SC.total=list.length;
  list.forEach(function(q,i){root.appendChild(qcard(q,i));});
  var box=document.createElement('div'); box.className='result'; box.id='result'; root.appendChild(box);
  syncStat();
}

function fmtCombo(s){
  return s.split('+').map(function(p){
    if(NAMEMAP[p])return NAMEMAP[p];
    if(/^f\d+$/.test(p))return p.toUpperCase();
    if(p.length===1)return p.toUpperCase();
    return p;
  }).join(' + ');
}

function initComputer(cfg){
  var root=$(cfg.root); if(!root) return;
  var ID=cfg.id;
  var LS={};   /* 本地状态容器 */

  /* ---------- 状态 ---------- */
  var pw='off';                 /* off | post | on | shut */

  var done={};

  /* ---------- 文件系统 ---------- */
  var FS={};
  function loadFS(spec){
    FS={};
    Object.keys(spec||{}).forEach(function(p){
      FS[p]=spec[p].map(function(it){
        return Array.isArray(it)?{n:it[0],d:!!it[1]}:{n:it.n,d:!!it.d};
      });
    });
  }
  loadFS(cfg.fs||{'C:':[['Windows',1],['Program Files',1],['用户',1]],'D:':[['照片',1],['文档',1]]});
  var BIN=[];
  var PHOTOS=cfg.photos||{};

  /* ---------- 应用集合 ---------- */
  var APPS=cfg.apps||['explorer'];
  var W={}, WS={};
  APPS.forEach(function(k){
    if(!APPDEF[k])return;
    var d=APPDEF[k];
    W[k]={t:(k==='classify'&&cfg.clsTitle)?cfg.clsTitle:d.t, ic:d.ic, rw:d.rw, rh:d.rh,
          x:0,y:0,w:200,h:160,min:false,max:false,closed:true,desk:0,z:0};
    WS[k]={};
  });
  function state(k){ return WS[k]||(WS[k]={}); }

  /* ---------- 桌面图标 ---------- */
  var ICONS=[];
  APPS.forEach(function(k){
    if(!W[k]||!APPDEF[k])return;
    if(k==='explorer')ICONS.push(['explorer','🖥','此电脑','open']);
    else if(k==='recycle')ICONS.push(['recycle','🗑','回收站','open']);
    else ICONS.push([k, W[k].ic, W[k].t, 'open']);
  });
  ICONS.push(['bin2','📂','项目资料','folder']);

  /* ================================================================
     骨架
     ================================================================ */
  root.className='rig';
  root.innerHTML=
   '<div class="mon"><div class="crt">'+

       '<div class="glass"></div></div></div>'+
       '<div class="chin"><span class="brand">BY-COMPUTER</span><span class="model">VX-1526</span>'+

       '<button class="dial" data-pwr="1" title="电源键：短按弹出电源菜单，按住 3 秒强制关机">⏻</button>'+
       '<span class="dial" title="亮度 −">−</span><span class="dial" title="亮度 +">+</span>'+
       '<span class="led" id="'+ID+'-led"></span></div>'+
     '</div>'+
     '<div class="stand"></div><div class="base"></div>'+
   '</div></div>'+
   '<div class="desk"></div>'+
   '<div class="kbwrap2">'+
     '<div class="kbbar">'+
       '<button class="btn" id="'+ID+'-mode">快捷键挑战</button>'+
       '<label><input type="checkbox" id="'+ID+'-fn"> Fn Lock</label>'+
     '</div>'+
     '<div class="target hidden" id="'+ID+'-target"></div>'+
     '<div class="kb2" id="'+ID+'-kb"></div>'+
     '<div class="kinfo" id="'+ID+'-info">点按下面实体键盘上的按键，或在电脑键盘上直接敲击，这里会显示它的作用。'+
     '按 Ctrl、Shift、Win 这类修饰键时，先按住再按下一个键，就是一个组合键。</div>'+
   '</div>';

  var scr=$('#'+ID+'-scr',root), kb=$('#'+ID+'-kb',root),
      info=$('#'+ID+'-info',root), tgt=$('#'+ID+'-target',root),
      led=$('#'+ID+'-led',root);

  /* ================================================================

      return '<div class="dicon" data-open="'+c[0]+'"><span>'+c[1]+'</span>'+c[2]+'</div>';}).join('')+'</div>'+

      '<button class="sb" data-act="start"><span class="logo"><i></i><i></i><i></i><i></i></span>开始</button>'+
      '<input class="find" placeholder="搜索" readonly tabindex="-1">'+

      '<div class="tray" data-act="tray"><span>📶</span><span>🔊</span><span>🔋</span>'+
      '<span class="clk" id="'+ID+'-clock"></span></div>'+
    '</div>';

  /* 窗口 DOM */
  Object.keys(W).forEach(function(k){
    var el=document.createElement('div');
    el.className='win min'; el.dataset.w=k;
    el.innerHTML='<div class="tb"><span class="ic">'+W[k].ic+'</span><span class="t">'+esc(W[k].t)+'</span>'+
      '<button data-a="min" title="最小化">─</button>'+
      '<button data-a="max" title="最大化">□</button>'+
      '<button data-a="close" class="x" title="关闭">✕</button></div>'+
      '<div class="bd"></div><div class="rs"></div>';
    scr.appendChild(el);
  });

  function el(k){ return $('.win[data-w="'+k+'"]',scr); }
  function bd(k){ return $('.bd',el(k)); }
  function maxH(){ return scr.clientHeight-34; }
  function maxW(){ return scr.clientWidth; }

  /* ================================================================
     通用渲染工具
     ================================================================ */
  function mark(k){ if(k&&!done[k]){ done[k]=1; paintTasks(); } }
  function paintTasks(){
    var ol=$('#'+ID+'-tasks',document); if(!ol)return;
    if(!ol.dataset.b){ ol.dataset.b='1'; TASKS.forEach(function(t){
      var li=document.createElement('li'); li.textContent=t.t; li.dataset.k=t.k; ol.appendChild(li); }); }
    $$('li',ol).forEach(function(li){ li.classList.toggle('ok',!!done[li.dataset.k]); });
    var n=TASKS.filter(function(t){return done[t.k];}).length, s=$('#'+ID+'-score');
    if(s)s.textContent='已完成 '+n+' / '+TASKS.length+' 项';
    if(TASKS.length&&TASKS.every(function(t){return done[t.k];})){
      if(!$('#'+ID+'-fin',ol.parentNode)){
        var f=document.createElement('div'); f.className='fin'; f.id=ID+'-fin';
        f.textContent='这一节的操作全部完成。'; ol.parentNode.appendChild(f); mark('__all'); }
    }
  }
  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    scr.appendChild(t);
    setTimeout(function(){ t.remove(); },1900);
  }
  function beep(){ if(led){ led.classList.add('wait'); setTimeout(function(){ setLed(pw==='on'?'on':''); },160);} }
  function active(k){
    if(k&&!W[k].closed&&!W[k].min&&W[k].desk===desk)return k;
    var vis=Object.keys(W).filter(function(x){return !W[x].closed&&!W[x].min&&W[x].desk===desk;});
    if(vis.length)return vis.sort(function(a,b){return W[a].z-W[b].z;})[vis.length-1];
    var pool=Object.keys(W).filter(function(x){return !W[x].closed&&W[x].desk===desk;});
    if(!pool.length)return '';
    return pool.sort(function(a,b){return W[a].z-W[b].z;})[pool.length-1];
  }
  function bring(k){ W[k].z=++z; el(k).style.zIndex=W[k].z; syncBlur(); }
  function syncBlur(){
    var top=active();
    Object.keys(W).forEach(function(k){ el(k).classList.toggle('blur',k!==top); });
  }

  /* ================================================================
     电源
     ================================================================ */
  var powerHold=null, powerLong=false, hintShown=false, frozen=false;
  function bindPower(node){
    function down(e){
      if(e.button!==undefined&&e.button!==0)return;
      e.preventDefault(); powerLong=false;
      powerHold=setTimeout(function(){
        powerHold=null; powerLong=true; forceOff();
      },3000);
      setTimeout(function(){ if(powerHold&&!hintShown){ hintShown=true;
        toast('继续按住不放，满 3 秒就会强制关机'); } },1100);
    }
    function up(){
      if(powerHold){ clearTimeout(powerHold); powerHold=null; if(!powerLong)powerTap(); }
    }
    node.addEventListener('pointerdown',down);
    node.addEventListener('pointerup',up);
    node.addEventListener('pointerleave',function(){ if(powerHold){clearTimeout(powerHold);powerHold=null;} });
    node.addEventListener('pointercancel',function(){ if(powerHold){clearTimeout(powerHold);powerHold=null;} });
    node.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  $$('[data-pwr]',root).forEach(bindPower);

  function setLed(cls){ if(!led)return; led.className='led'+(cls?' '+cls:''); }
  function setOn(on){
    var off=$('.off',scr), post=$('.post',scr), shut=$('.shut',scr), col=$('.collapse',scr);
    if(off)off.remove(); if(shut)shut.remove(); if(col)col.remove();
    if(!on){ if(post)post.remove(); }
  }
  function screenOff(msg,cls){
    setOn(false); pw='off'; setLed('');
    var d=document.createElement('div'); d.className='off'+(cls?' '+cls:'');
    d.innerHTML=msg; scr.appendChild(d);
  }
  function goLive(){
    if(frozen)return;
    $$('.post,.shut,.off,.collapse',scr).forEach(function(n){ n.remove(); });
    pw='on'; setLed('on'); layout(); paintAll(); mark('power');
    var bs=state('booted');
    if(!bs.b){
      bs.b=1;
      if(cfg.startPage&&W.browser){
        newTab(cfg.startPage,cfg.startTitle||'新标签页',cfg.startUrl||'');
        open('browser');
      }
      (cfg.openAtBoot||[]).forEach(function(k){ if(W[k])open(k); });
    }
  }
  function boot(){
    if(pw!=='off')return;
    pw='post'; setLed('wait'); beep(); mark('boot');
    var pre=document.createElement('div'); pre.className='post';
    var i=0;
    function step(){
      if(pw!=='post')return;
      pre.innerHTML=POSTLINES.slice(0,i).map(esc).join('\n');
      i++;
      if(i<=POSTLINES.length) setTimeout(step,cfg.postSpeed||90);
      else setTimeout(finishBoot,420);
    }
    function finishBoot(){ if(pw!=='post')return; goLive(); }
    scr.appendChild(pre); step();
    pre.addEventListener('click',function(){ i=POSTLINES.length+1; finishBoot(); });
  }
  function shutdown(kind){
    if(pw!=='on')return;
    pw='shut'; closeAll(); setLed('');
    if(kind==='force'){
      var c=document.createElement('div'); c.className='collapse'; c.innerHTML='<i></i>';
      scr.appendChild(c);
      setTimeout(function(){ c.remove(); screenOff('已强制关机，没有走正常的关机流程。<br>'+
        '下次开机可能提示「磁盘检查」，重要文件容易损坏，只在这一种情况下使用：<br>'+
        '屏幕完全卡死、鼠标与电源菜单都没有反应。','force'); mark('force'); },380);
      return;
    }
    var s=document.createElement('div'); s.className='shut';
    s.innerHTML='<span class="spin"></span>正在关机';
    scr.appendChild(s);
    setTimeout(function(){ s.remove();
      var c=document.createElement('div'); c.className='collapse'; c.innerHTML='<i></i>';
      scr.appendChild(c);
      setTimeout(function(){ c.remove();
        screenOff('已关机。<br>按显示器上的电源键开机。'); mark('shutdown'); },620);
    },1100);
  }
  function powerTap(){
    beep();
    if(frozen){ toast('屏幕完全没有反应，短按电源键也不起作用。要按住不放 3 秒。'); return; }
    if(pw==='off'){ boot(); return; }
    if(pw==='on'){ powerMenu(); return; }
  }
  function forceOff(){ if(pw==='off')return; frozen=false; shutdown('force'); }
  function powerMenu(){
    closeAll();
    var m=document.createElement('div'); m.className='pmenu';
    m.innerHTML='<h5>电源选项</h5>'+
      '<div data-p="sleep">🌙　睡眠</div>'+
      '<div data-p="shut">⏻　关机</div>'+
      '<div data-p="reboot">↻　重启</div>'+
      '<div data-p="lock">🔒　锁定</div>'+
      '<div class="tip">短按电源键弹出这个菜单；按住电源键不放满 3 秒会强制关机。</div>';
    m.addEventListener('click',function(e){
      var d=e.target.closest('[data-p]'); if(!d)return;
      var v=d.dataset.p; closeAll();
      if(v==='shut')shutdown();
      else if(v==='reboot'){ pw='on'; shutdown(); setTimeout(boot,1300); }
      else if(v==='lock'){ toast('已锁定，需要密码才能回到桌面'); mark('lock'); }
      else toast('已进入睡眠，按任意键唤醒');
    });
    scr.appendChild(m); pop(m,'pm');
  }

  /* ================================================================
     弹出层管理
     ================================================================ */
  var pops={};
  function closeAll(){
    $$('.startmenu,.ctx,.snapfly,.traypop,.pmenu,.tv,.switcher',scr).forEach(function(n){ n.remove(); });
    pops={};
  }
  function pop(node,which){ closeAll(); scr.appendChild(node); pops[which]=node; return node; }

  /* ================================================================
     窗口布局
     ================================================================ */
  var cascade=0;
  function defBox(k){
    var W0=maxW(), H0=maxH(), d=W[k];
    var w=Math.max(148,Math.round(W0*d.rw)), h=Math.max(104,Math.round(H0*d.rh));
    if(W0<520){ w=Math.max(140,W0-24); h=Math.max(100,H0-26); }
    var ox=(cascade%4)*14, oy=(cascade%4)*12; cascade++;
    return {w:w,h:h,x:Math.max(4,Math.round((W0-w)/2)-24+ox),y:Math.max(4,Math.round((H0-h)/2)-16+oy)};
  }
  function clampWin(k){
    var w=W[k], SW=maxW(), SH=maxH();
    w.w=Math.min(w.w,Math.max(140,SW-8));
    w.h=Math.min(w.h,Math.max(96,SH-8));
    w.x=Math.min(Math.max(0,w.x),Math.max(0,SW-w.w));
    w.y=Math.min(Math.max(0,w.y),Math.max(0,SH-w.h));
  }
  function open(k){
    if(!W[k])return;
    if(W[k].closed||W[k]._new){ var b=defBox(k); W[k].w=b.w; W[k].h=b.h; W[k].x=b.x; W[k].y=b.y; W[k]._new=false; }
    W[k].closed=false; W[k].min=false; W[k].desk=desk;
    paint(k); bring(k); layout(); mark('open:'+k); mark('open'); beep();
  }
  function closeWin(k){
    if(!W[k])return;
    W[k].closed=true; el(k).style.display='none'; layout(); mark('close:'+k); mark('close');
    var onClose=(APP[k]&&APP[k].onClose); if(onClose)onClose(k);
  }
  function minWin(k){ if(!W[k])return; W[k].min=true; layout(); mark('min'); }
  function maxWin(k){
    if(!W[k])return;
    W[k].max=!W[k].max; W[k].min=false; bring(k); layout(); mark('max');
  }
  function snap(k,side){
    var w=W[k]; if(!w)return;
    var SW=maxW(), SH=maxH();
    w.max=false; w.min=false;
    if(side==='max'){ w.max=true; w.x=0; w.y=0; w.w=SW; w.h=SH; }
    else { w.w=Math.round(SW/2)-2; w.h=SH; w.y=0; w.x=(side==='left')?0:Math.round(SW/2)+2; }
    bring(k); layout();
    if(side==='left')mark('snapL'); if(side==='right')mark('snapR');
  }
  function toggle(k){
    var w=W[k]; if(!w)return;
    if(w.closed){open(k);return;}
    w.min=!w.min; if(!w.min)bring(k); layout();
    if(!w.min)mark('open:'+k);
  }
  function layout(){
    var SW=maxW(), SH=maxH();
    Object.keys(W).forEach(function(k){
      var w=W[k], e=el(k);
      if(w.closed||w.min||w.desk!==desk){ e.classList.add('min'); e.style.display='none'; return; }
      e.classList.remove('min'); e.style.display='flex';
      if(w.max){ w.x=0; w.y=0; w.w=SW; w.h=SH; }
      clampWin(k);
      e.style.left=w.x+'px'; e.style.top=w.y+'px';
      e.style.width=w.w+'px'; e.style.height=w.h+'px';
    });
    syncBar(); syncBlur();
  }
  function syncBar(){
    var holder=$('#'+ID+'-pins',scr); if(!holder)return;
    var running=APPS.filter(function(k){ return W[k]&&!W[k].closed&&W[k].desk===desk; });
    holder.innerHTML=running.map(function(k){
      return '<button class="pi run" data-app="'+k+'" title="'+esc(W[k].t)+'">'+W[k].ic+'</button>';
    }).join('');
  }
  window.addEventListener('resize',function(){ layout(); });

  function pasteClip(){
    if(!CLIPBOARD.length){ toast('剪贴板里没有内容'); return; }
    var path=(W.explorer&&FSEL.path)||'D:';
    var arr=FS[path]||(FS[path]=[]);

  function explorerAct(a){
    var arr=FSEL.path==='回收站'?null:(FS[FSEL.path]||(FS[FSEL.path]=[]));
    if(a==='restore'){
      if(FSEL.sel<0||!BIN[FSEL.sel]){ toast('先点一下要还原的文件'); return; }
      var o=BIN.splice(FSEL.sel,1)[0];
      (FS[o.from]||(FS[o.from]=[])).push({n:o.n,d:o.d});
      FSEL.sel=-1;
      if(/草稿|作业|风景|合影|说明/.test(o.n))mark('restore');
      toast('已还原到 '+o.from); paint('explorer'); return;
    }
    if(a==='emptybin'){ BIN.length=0; FSEL.sel=-1; paint('explorer'); toast('回收站已清空'); return; }
    if(a==='mkdir'){ if(!arr)return; EDITING={mode:'new'}; FSEL.sel=-1; paint('explorer'); return; }
    if(a==='rename'||a==='ren'){ if(!arr||FSEL.sel<0){ toast('先选中一个项目'); return; }
      EDITING={mode:'rename',i:FSEL.sel}; paint('explorer'); return; }
    if(a==='ext'){ var s=state('explorer'); s.ext=!s.ext;
      if(s.ext)mark('ext');
      toast(s.ext?'已显示文件扩展名':'已隐藏文件扩展名');
      paint('explorer'); return; }
    if(a==='copy'||a==='cut'){
      if(!arr||FSEL.sel<0){ toast('先选中一个项目'); return; }
      var it=arr[FSEL.sel];
      CLIPF={from:FSEL.path,i:FSEL.sel,cut:a==='cut',n:it.n,d:it.d};
      CLIPBOARD=[{n:it.n,d:it.d,from:FSEL.path,cut:a==='cut',ref:it}];
      toast(a==='cut'?'已剪切「'+it.n+'」':'已复制「'+it.n+'」');
      mark(a==='cut'?'cut':'copy'); paint('explorer'); return;
    }
    if(a==='paste'){
      if(!CLIPF){ toast('剪贴板里没有内容'); return; }
      if(!arr){ toast('回收站里不能粘贴'); return; }
      var src=FS[CLIPF.from]||[], item=src[CLIPF.i];
      if(!item){ CLIPF=null; paint('explorer'); return; }
      arr.push({n:item.n,d:item.d});
      var moved=CLIPF.cut, nm=CLIPF.n, from=CLIPF.from;
      if(moved)src.splice(CLIPF.i,1);
      CLIPF=null; FSEL.sel=-1;
      if(nm==='风景.jpg'&&from==='D:\\照片'&&FSEL.path==='D:\\归档')mark('copy');
      if(nm==='合影.jpg'&&moved&&FSEL.path==='D:\\归档')mark('cut');
      if(nm==='合影.jpg'&&!moved&&FSEL.path==='D:\\备份')mark('backup');
      toast('已粘贴到 '+FSEL.path); paint('explorer'); return;
    }
    if(a==='del'||a==='delp'){
      if(!arr||FSEL.sel<0){ toast('先选中一个项目'); return; }
      var it2=arr[FSEL.sel];
      arr.splice(FSEL.sel,1);
      if(a==='del'){ BIN.push({n:it2.n,d:it2.d,from:FSEL.path}); UNDO=function(){BIN.pop();arr.push(it2);}; }
      else { UNDO=function(){arr.push(it2);}; }
      if(a==='delp')mark('delp');
      toast(a==='del'?'已删除到回收站「'+it2.n+'」':'已永久删除「'+it2.n+'」');
      FSEL.sel=-1; paint('explorer'); return;
    }
    if(a==='undo'){ if(UNDO){ UNDO(); UNDO=null; toast('已撤销上一步'); paint('explorer'); } else toast('没有可以撤销的操作'); }
  }

  function paintIme(){
    var bar=$('[data-ime]',bd('notepad')); if(!bar)return;
    if(!imeCn||!PY_BUF){ bar.innerHTML=imeCn
      ?'<span style="color:#8b949e">中文输入法：直接在键盘上敲拼音，候选词会出现在这里</span>'
      :'<span style="color:#8b949e">英文输入法</span>'; return; }
    var list=PINYIN[PY_BUF]||[];
    bar.innerHTML='<span>拼音：<b>'+esc(PY_BUF)+'</b></span>'+
      (list.length?list.map(function(c,i){
        return '<span class="cand'+(i===0?' first':'')+'" data-c="'+i+'">'+(i+1)+' '+esc(c)+'</span>';}).join('')
        :'<span style="color:#a32020">没有匹配的候选词</span>')+
      '<span style="color:#8b949e">按空格或数字键选词</span>';
  }
  function commitPy(i){
    var list=PINYIN[PY_BUF]||[];
    if(!list.length){ PY_BUF=''; paintIme(); return; }
    var word=list[Math.min(i,list.length-1)];
    PY_BUF=''; insertNotepad(word); paintIme();
    mark('type-cn');
  }
  function insertNotepad(text){
    var s=state('notepad');
    mark('type-any');
    var ta=W.notepad?$('[data-ta]',bd('notepad')):null;
    if(ta){
      var a=ta.selectionStart||0, b=ta.selectionEnd||0;
      ta.value=ta.value.slice(0,a)+text+ta.value.slice(b);
      ta.selectionStart=ta.selectionEnd=a+text.length;
      s.txt=ta.value;
      try{ ta.focus(); }catch(err){}
    }else{
      s.txt=(s.txt||'')+text;
    }
  }
  function backNotepad(){
    if(PY_BUF){ PY_BUF=PY_BUF.slice(0,-1); paintIme(); return; }
    var ta=W.notepad?$('[data-ta]',bd('notepad')):null;
    if(!ta)return;
    var a=ta.selectionStart||0;
    if(a<=0)return;
    ta.value=ta.value.slice(0,a-1)+ta.value.slice(a);
    ta.selectionStart=ta.selectionEnd=a-1;
    state('notepad').txt=ta.value;
    try{ ta.focus(); }catch(err){}
  }
  function typeChar(ch){
    if(ch==='Backspace'){ backNotepad(); return; }
    if(ch==='Enter'){ insertNotepad('\n'); return; }
    if(ch===' '){
      if(imeCn&&PY_BUF){ commitPy(0); return; }
      insertNotepad(' '); return;
    }
    if(ch.length===1&&/[a-zA-Z]/.test(ch)){
      if(imeCn){ PY_BUF+=ch.toLowerCase(); paintIme(); return; }
      insertNotepad(ch); mark('type-en'); return;
    }
    if(ch.length===1&&/[0-9]/.test(ch)){ insertNotepad(ch); return; }
    if(ch.length===1&&imeCn){
      var m={',':'，','.':'。','?':'？','!':'！',';':'；',':':'：','(':'（',')':'）',
             '<':'《','>':'》','\\':'、','[':'【',']':'】',"'":'‘','"':'“','`':'·',
             '~':'～','@':'＠','#':'＃','$':'￥','%':'％','^':'……','&':'＆','*':'＊',
             '-':'－','=':'＝','/':'、'};
      if(m[ch]){ insertNotepad(m[ch]); mark('sym-cn'); return; }
    }
    if(ch.length===1){ insertNotepad(ch); mark('type-en'); }
  }
  function clearPy(){ if(PY_BUF){ PY_BUF=''; paintIme(); } }

          s.sel=(s.sel===i?-1:i); paint(k); return;
        }
        var b=ev.target.closest('[data-bin]');
        if(b&&s.sel>=0){
          var it=c.items[s.sel], kk=b.dataset.bin, ok=it.c===kk;
          s.placed[s.sel]=ok?('ok:'+kk):('bad:'+kk);

              c.items.length+' 项，标红的放错了，已经归到正确的一侧。');

  function startShot(){
    if($('.cap',scr))return;
    var cap=document.createElement('div'); cap.className='cap';
    var box=document.createElement('div'); box.className='selbox'; box.style.display='none';
    cap.appendChild(box); scr.appendChild(cap);
    var sx=0,sy=0,on=false;
    function done(){
      cap.remove();
      state('snipping').shot=1; if(W.snipping)paint('snipping');
      mark('shot'); toast('已框选区域并复制到剪贴板');
    }
    cap.addEventListener('pointerdown',function(e){
      var p=localPt(e); sx=p.x; sy=p.y; on=true;
      box.style.display='block'; box.style.left=sx+'px'; box.style.top=sy+'px';
      box.style.width='0px'; box.style.height='0px';
      try{ cap.setPointerCapture(e.pointerId); }catch(err){}
    });
    cap.addEventListener('pointermove',function(e){
      if(!on)return;
      var p=localPt(e);
      box.style.left=Math.min(sx,p.x)+'px'; box.style.top=Math.min(sy,p.y)+'px';
      box.style.width=Math.abs(p.x-sx)+'px'; box.style.height=Math.abs(p.y-sy)+'px';
    });
    cap.addEventListener('pointerup',function(){
      if(!on)return; on=false;
      if(parseFloat(box.style.width)<6||parseFloat(box.style.height)<6){ cap.remove(); return; }
      done();
    });
    cap.addEventListener('contextmenu',function(e){ e.preventDefault(); cap.remove(); });
  }

  function keyName(e){
    if(e.key===' ')return 'Space';
    if(e.key==='Meta')return 'Win';
    if(e.key==='Control')return 'Ctrl';
    if(e.key==='Escape')return 'Esc';
    if(e.key==='PrintScreen')return 'PrtSc';
    if(e.key==='ScrollLock')return 'ScrLk';
    if(e.key==='Insert')return 'Ins';
    if(e.key==='PageUp')return 'PgUp';
    if(e.key==='PageDown')return 'PgDn';
    if(e.key==='ContextMenu')return 'Menu';
    if(e.key.indexOf('Arrow')===0)
      return {'ArrowLeft':'←','ArrowRight':'→','ArrowUp':'↑','ArrowDown':'↓'}[e.key];
    if(e.key.length===1&&/[A-Z]/.test(e.key))return e.key;
    if(e.key.length===1&&/[a-z]/.test(e.key))return e.key.toUpperCase();
    return e.key;
  }
  function mods(){
    return ['ctrl','shift','alt','meta'].filter(function(m){return held.indexOf(m)>=0;});
  }
  function comboKey(key){
    var m=mods();
    return m.join('+')+(m.length?'+':'')+key;
  }

  var NOFIRE={enter:1,tab:1,backspace:1,space:1,shift:1,ctrl:1,alt:1,meta:1,numlock:1,capslock:1};
  kb.addEventListener('click',function(e){
    var b=e.target.closest('.kk'); if(!b)return;
    var k=findKey(b.dataset.c);
    if(['Ctrl','Win','Alt','Shift','Fn'].indexOf(k.c)>=0){
      if(k.c==='Fn'){ showKey('功能键 Fn','笔记本上配合 F1–F12 在两组功能之间切换。'); return; }
      var m=modOf(k.c), i=held.indexOf(m);
      if(i>=0){
        held.splice(i,1); syncKb();
        if(!held.length){
          if(!comboFired&&COMBOS[m]){ fire(m); }
          else if(!comboFired){
            info.innerHTML='<span class="combo">'+esc(SHOWMOD[m])+'</span> → 修饰键，单独按下不产生动作，'+
              '要按住再按下一个键才组成组合键。';
          }
          comboFired=false;
        }else{
          showKey('已按住 '+held.map(function(x){return SHOWMOD[x];}).join(' + '),
            '这时再按下一个普通键，就是一个组合键。');
        }
        return;
      }
      held.push(m); if(held.length===1)comboFired=false;
      syncKb();
      showKey('已按住 '+held.map(function(x){return SHOWMOD[x];}).join(' + '),
        '这时再按下一个普通键，就是一个组合键。');
      return;
    }
    var m2=mods();
    var single=(KEYID[k.c]||k.c.toLowerCase());
    mark('key:'+k.c);
    if(m2.length){
      showKey(k.n||(k.c+' 键'),k.d||'');
      fire(comboKey(single));
      held.length=0; syncKb(); comboFired=false;
      return;
    }
    if(!NOFIRE[single]&&COMBOS[single]&&/^(f\d+|esc|prtsc|delete)$/.test(single)){
      fire(single);
    }else{
      showKey(k.n||(k.c+' 键'),k.d||'');
    }
    if(W.notepad&&!W.notepad.closed&&!W.notepad.min){
      if(k.c.length===1)typeChar(k.c);
      else if(k.c==='Space')typeChar(' ');
      else if(k.c==='Enter')typeChar('Enter');
      else if(k.c==='Backspace')typeChar('Backspace');
    }
    if(k.c==='CapsLock'){ info.innerHTML='<b>大写锁定键 Caps Lock</b>　指示灯亮起时输入的字母全为大写。'+
      '密码框里的大小写是敏感的，误开了它就会一直提示密码错误。'; }
  });

  document.addEventListener('keydown',function(e){
    if(!document.body.contains(root))return;
    var t=e.target, tag=t&&t.tagName;
    if(tag==='INPUT'&&scr.contains(t))return;
    if((tag==='INPUT'||tag==='TEXTAREA')&&!scr.contains(t))return;
    if(pw!=='on')return;
    var name=keyName(e), m=MODN[e.key];
    if(m){
      if(held.indexOf(m)<0){ held.push(m); if(held.length===1)comboFired=false; }
      syncKb();
      $$('.kk',kb).forEach(function(b){ if(b.dataset.c===name)b.classList.add('on'); });
      return;
    }
    $$('.kk',kb).forEach(function(b){ if(b.dataset.c===name)b.classList.add('hit'); });
    var isEditing=!!(W.notepad&&!W.notepad.closed&&tag==='TEXTAREA'&&scr.contains(t));
    var onlyShift=e.shiftKey&&!e.ctrlKey&&!e.altKey&&!e.metaKey;
    if((e.ctrlKey||e.altKey||e.metaKey||e.shiftKey)&&!(onlyShift&&name.length===1)){
      if(!isEditing)e.preventDefault();
      fire(comboKey(KEYID[name]||name.toLowerCase()));
      return;
    }
    var k=findKey(name);
    showKey(k.n||(name+' 键'),k.d||'');
    mark('key:'+name);
    if(isEditing){
      if(e.key==='Escape'){ clearPy(); return; }
      if(e.key==='Enter'){ clearPy(); return; }
      if(e.key==='Tab'){ e.preventDefault(); return; }
      if(imeCn&&PY_BUF&&e.key===' '){ e.preventDefault(); commitPy(0); return; }
      if(imeCn&&PY_BUF&&/^[1-5]$/.test(e.key)){ e.preventDefault(); commitPy(+e.key-1); return; }
      if(e.key==='Backspace'){ if(PY_BUF||imeCn){ e.preventDefault(); backNotepad(); } return; }
      if(imeCn&&e.key.length===1){ e.preventDefault(); typeChar(e.key); return; }
      if(!imeCn&&(e.key.length===1||e.key===' ')){ mark('type-en'); return; }
      return;
    }
    if(W.notepad&&!W.notepad.closed&&!W.notepad.min&&e.key.length===1){ typeChar(e.key); e.preventDefault(); return; }
    if(['Tab','F4','F10','F11','F12',' ','Backspace','ArrowLeft','ArrowRight','ArrowUp',
        'ArrowDown','F1','F2','F3','F5','F6','F7','Delete','Enter'].indexOf(e.key)>=0)e.preventDefault();
  });
  document.addEventListener('keyup',function(e){
    var m=MODN[e.key];
    if(m){
      var idx=held.indexOf(m);
      if(idx>=0)held.splice(idx,1);
      $$('.kk',kb).forEach(function(b){ if(b.dataset.c===keyName(e))b.classList.remove('hit'); });
      if(!held.length){
        syncKb();
        if(!comboFired){
          if(COMBOS[m])fire(m);
          else info.innerHTML='<span class="combo">'+esc(SHOWMOD[m])+'</span> → 修饰键，'+
            '单独按下不产生动作。要发挥作用，得在按住的同时再按一个键。';
        }
        comboFired=false;
      }
    }
    $$('.kk',kb).forEach(function(b){ if(b.dataset.c===keyName(e))b.classList.remove('hit'); });
  });
  $('#'+ID+'-fn',root).onchange=function(e){ fnLock=e.target.checked; drawKb();
    mark('fnlock');
    info.innerHTML='<b>Fn Lock 已'+(fnLock?'开启':'关闭')+'</b>　'+(fnLock
      ? '现在直接按 F 行执行的是 F1 到 F12 本身。'
      : '现在直接按 F 行执行的是键帽上方图标对应的功能，要执行 F1 到 F12 需按住 Fn。'); };
  var mb=$('#'+ID+'-mode',root);
  mb.onclick=function(){
    if(challenge){ challenge=null; clef=0; mb.textContent='快捷键挑战'; tgt.classList.add('hidden'); return; }
    clist=shuf(cfg.challenge||[{a:'复制',k:'ctrl+c'},{a:'粘贴',k:'ctrl+v'},{a:'撤销',k:'ctrl+z'}]);
    clef=0; mb.textContent='退出挑战'; tgt.classList.remove('hidden'); nextChallenge(); mark('challenge');
  };
  drawKb();

  scr.addEventListener('wheel',function(e){
    var w=e.target.closest('.win');
    if(w){ var el2=$('.bd',w); if(el2){ el2.scrollTop+=e.deltaY; e.preventDefault(); } }
  },{passive:false});

  /* ================================================================
     时钟
     ================================================================ */
  function clock(){
    var d=new Date(), c=$('#'+ID+'-clock',scr);
    if(c)c.innerHTML=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+
      '<br>'+(d.getMonth()+1)+'/'+d.getDate();
  }
  clock(); setInterval(clock,20000);

  /* ================================================================
     对外接口
     ================================================================ */
  var API={
    open:open, close:function(k){ closeWin(k||active()); }, min:function(){ minWin(active()); },
    max:function(){ var a=active(); if(a)maxWin(a); },
    snapL:function(){ snap(active(),'left'); }, snapR:function(){ snap(active(),'right'); },
    alt:altTab, show:showDesk, task:taskView, newDesk:newDesk, cycleDesk:cycleDesk,
    boot:boot, power:powerTap, forceOff:forceOff, shutdown:shutdown, on:goLive,
    skipPost:function(){ if(pw==='post'||pw==='off')goLive(); },
    combo:function(s){ fire(s); return COMBOS[s]||''; },
    combos:function(){ return Object.keys(COMBOS); },
    openPage:openPage, setPane:function(p){ setSel('settings',p); if(W.settings){open('settings');paint('settings');} },
    notepadText:function(){ var ta=$('[data-ta]',bd('notepad')); return ta?ta.value:(state('notepad').txt||''); },
    setIme:function(v){ imeCn=(v!=='en'); var ie=$('.ime',scr); if(ie)ie.textContent=imeCn?'中':'英'; },
    type:function(ch){ typeChar(ch); },
    state:function(){ return {pw:pw,desk:desks,cur:desk,open:Object.keys(W).filter(function(k){
      return !W[k].closed;}),done:Object.keys(done).filter(function(k){return k!=='__all';}),
      ime:imeCn?'cn':'en',fs:FS,bin:BIN,targets:challenge?challenge.k:''}; },
    tasks:function(){ return TASKS.map(function(t){return {t:t.t,k:t.k,ok:!!done[t.k]};}); }
  };
  window['pc_'+ID]=API;
  window['dsk_'+ID]=API;
  window['kb_'+ID]=API;

  /* ================================================================
     启动
     ================================================================ */
  paintTasks();
  if(cfg.bsod){
    /* 故障场景：一开机就是蓝屏，必须先强制关机 */
    setTimeout(function(){
      frozen=true;
      var b=document.createElement('div'); b.className='ap-bsod';
      b.innerHTML='<div class="face">:(</div>'+
        '<div>你的电脑遇到问题，需要重新启动。我们只收集某些错误信息，然后为你重新启动。</div>'+
        '<div style="margin-top:10px;font-size:20px">0% 完成</div>'+
        '<div class="pc2">停止代码：CRITICAL_PROCESS_DIED<br>'+
        '屏幕上的一切都没有反应，鼠标也不动。<br>'+
        '按电源键短按一次没有回应 —— 这时候只能按住电源键约 3 秒强制关机。</div>';
      scr.appendChild(b); setLed('on'); pw='on'; layout();
    },400);
  }else if(cfg.startOff){
    screenOff('显示器没有信号。<br>按显示器上的电源键开机。');
  }else{
    setTimeout(function(){ boot(); },260);
  }
  setTimeout(function(){ layout(); paintAll(); },0);
}


/* ============ 启动 ============ */
function initTabs(){
  var tabs=$('#tabs'); if(!tabs)return;
  var panes=$$('.tabpane');
  var names={quiz:'自测题',lab:'动手练'};
  var btns=[];
  function show(i){
    btns.forEach(function(x){ x.setAttribute('aria-selected','false'); });
    if(btns[i])btns[i].setAttribute('aria-selected','true');
    panes.forEach(function(x){ x.classList.add('hidden'); });
    if(panes[i])panes[i].classList.remove('hidden');
  }
  panes.forEach(function(p,i){
    var b=document.createElement('button');
    b.textContent=(p.dataset.name||names[p.id.replace('tab-','')]||('第'+(i+1)+'部分'));
    b.onclick=function(){ show(i); window.scrollTo({top:0,behavior:'smooth'}); };
    tabs.appendChild(b); btns.push(b);
  });
  var want=(location.hash||'').replace('#','');
  var k=-1;
  panes.forEach(function(p,i){ if(p.dataset.name===want||p.id==='tab-'+want)k=i; });
  show(k>=0?k:0);
  window.addEventListener('hashchange',function(){
    var h=(location.hash||'').replace('#','');
    var j=-1;
    panes.forEach(function(p,i){ if(p.dataset.name===h||p.id==='tab-'+h)j=i; });
    if(j>=0)show(j);
  });
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    initTabs();
    var d=$('#qdata');
    if(d&&$('#quiz')) renderQuiz(JSON.parse(d.textContent));
  }catch(err){
    var box=document.createElement('div');
    box.className='lead'; box.id='boot-error';
    box.style.cssText='border-left:3px solid var(--no);margin:14px 0';
    box.textContent='页面未能正常初始化：'+err.message+
      '　请用浏览器直接打开本文件（双击），不要通过代码预览器查看。';
    var m=$('main')||document.body;
    m.insertBefore(box,m.firstChild);
  }
});
