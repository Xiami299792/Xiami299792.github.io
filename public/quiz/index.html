<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<!-- 字体：已去掉 Google Fonts 依赖（国内被墙，且是外链）。
     四套皮肤的字体栈都自带系统回退（Songti SC / SimSun / Consolas / sans-serif），
     去掉后自动降级，不需要额外字体文件。 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFE6D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>军事理论 · 刷题</title>
<!-- 非阻塞加载：字体拿不到（例如国内网络）时立刻回退系统字体，不拖慢首屏 -->
<style>
/* ============================================================
   军事理论刷题 · 红黑构成主题
   设计语言：构成主义海报 —— 米白 / 大红 / 纯黑，
   2–3px 硬边框、零圆角、衬线标题、等宽数字、斜切色块。
   ============================================================ */
:root{
  --bg:#EFE6D4; --surf:#F5EDDD; --surf2:#E6DCC6;
  --rule:#121212; --line:#D5C9AE;
  --tx:#121212; --dim:#6B6253; --dim2:#867C69;
  --acc:#C02424; --acc-fg:#F6EFE1;
  --inv-bg:#121212; --inv-fg:#EFE6D4;
  --ok:#1A7643; --bad:#B01E18; --warn:#8B5F08;
  --okbg:rgba(27,122,69,.10); --badbg:rgba(196,34,28,.10);
  --f-head:'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,Georgia,serif;
  --f-body:'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,Georgia,serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --fs:16px;
  --tabsh:66px; --hdr-bg:#C02424; --hdr-fg:#F6EFE1;
  --sh:3px 3px 0 rgba(18,18,18,.13);
}
html[data-theme="dark"]{
  --bg:#141210; --surf:#1C1916; --surf2:#242019;
  --rule:#EFE6D4; --line:#3A332B;
  --tx:#EFE6D4; --dim:#9A8F7C; --dim2:#736B5B;
  --acc:#EA533D; --acc-fg:#141210;
  --inv-bg:#EFE6D4; --inv-fg:#141210;
  --ok:#4FA96B; --bad:#EA533D; --warn:#D9A441;
  --okbg:rgba(79,169,107,.14); --badbg:rgba(232,70,47,.14);
  --sh:3px 3px 0 rgba(0,0,0,.4);
}
/* ============ 皮肤 A：Creative Voltage（深紫 · 电压条纹） ============ */
html[data-skin="voltage"]{ --sh:3px 3px 0 rgba(0,0,0,.45);
  --hdr-bg:#c9a4ff; --hdr-fg:#0f0b1a; --chip-bg:#ffb020; --chip-fg:#0f0b1a;
  --bg:#0f0b1a; --surf:#181128; --surf2:#241c3a; --rule:#3a2d5c; --line:#241c3a;
  --tx:#f2ecff; --dim:#9b8ec4; --dim2:#6d5f96;
  --acc:#c9a4ff; --acc-fg:#0f0b1a; --inv-bg:#ffb020; --inv-fg:#0f0b1a;
  --ok:#4ade80; --bad:#ff5ca8; --warn:#ffb020;
  --okbg:rgba(74,222,128,.14); --badbg:rgba(255,92,168,.16);
  --f-head:'Space Grotesk','Noto Sans SC',sans-serif;
  --f-body:'Space Grotesk','Noto Sans SC',sans-serif; }
html[data-skin="voltage"] .status{border-bottom:3px solid var(--warn);padding-bottom:14px}
html[data-skin="voltage"] .track i{background:repeating-linear-gradient(135deg,#ffb020 0 6px,#ff5ca8 6px 12px)}
html[data-skin="voltage"] .sec{color:#ff5ca8;font-family:var(--f-mono);letter-spacing:.24em;font-size:11px}
html[data-skin="voltage"] .card,
html[data-skin="voltage"] .c3,
html[data-skin="voltage"] .item{border-left:4px solid var(--warn)}
html[data-skin="voltage"] .hero-btn{background:var(--acc);color:var(--acc-fg)}
html[data-skin="voltage"] .c3.on{background:var(--acc);color:var(--acc-fg);border-left-color:var(--acc-fg)}
html[data-skin="voltage"] .c3.on .ds,html[data-skin="voltage"] .c3.on .n{color:var(--acc-fg);opacity:.7}
html[data-skin="voltage"] .k4 div:nth-child(3),
html[data-skin="voltage"] .kpis div:last-child{background:var(--warn);color:var(--acc-fg)}

/* ============ 皮肤 B：Terminal Green（GitHub 暗 · 终端绿 · CRT） ============ */
html[data-skin="terminal"]{ --sh:3px 3px 0 rgba(0,0,0,.5);
  --hdr-bg:#0a1a0e; --hdr-fg:#39d353; --chip-bg:#f0b429; --chip-fg:#0d1117;
  --bg:#0d1117; --surf:#0a1a0e; --surf2:#0f2415; --rule:#1f3d24; --line:#1f3d24;
  --tx:#39d353; --dim:#2aa855; --dim2:#1e7a3c;
  --acc:#39d353; --acc-fg:#0d1117; --inv-bg:#f0b429; --inv-fg:#0d1117;
  --ok:#39d353; --bad:#ff6b6b; --warn:#f0b429;
  --okbg:rgba(57,211,83,.12); --badbg:rgba(255,107,107,.14);
  --f-head:'Share Tech Mono','Noto Sans SC',monospace;
  --f-body:'Share Tech Mono','Noto Sans SC',monospace; }
html[data-skin="terminal"] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:998;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  transform:translateZ(0);will-change:transform;contain:strict}
html[data-skin="terminal"] .brand .tx b,
html[data-skin="terminal"] .sec{text-shadow:0 0 7px currentColor}
html[data-skin="terminal"] .sec::before{content:"> ";color:var(--warn);font-family:var(--f-mono)}
html[data-skin="terminal"] .sec{font-family:var(--f-mono);letter-spacing:.2em;font-size:11px;color:var(--dim)}
html[data-skin="terminal"] .sec::after{background:var(--line);opacity:.9}
html[data-skin="terminal"] .card,
html[data-skin="terminal"] .qcard,
html[data-skin="terminal"] .status{border-style:dashed}
html[data-skin="terminal"] .c3 .nm{font-family:var(--f-mono);letter-spacing:.06em}
html[data-skin="terminal"] .c3.on{background:rgba(57,211,83,.14);color:var(--tx)}
html[data-skin="terminal"] .k4 div:nth-child(3),
html[data-skin="terminal"] .kpis div:last-child{background:transparent;color:var(--warn);
  box-shadow:inset 0 0 0 2px var(--warn)}

/* ============ 皮肤 C：Split Pastel（浅色 · 分栏柔彩） ============ */
html[data-skin="pastel"]{ --sh:0 3px 10px rgba(80,70,110,.08);
  --hdr-bg:#a06cd5; --hdr-fg:#ffffff; --chip-bg:#e0f7f5; --chip-fg:#1d6b66;
  --bg:#fdfcfb; --surf:#ffffff; --surf2:#f6f4fb; --rule:#e8e4f0; --line:#efeaf7;
  --tx:#22212b; --dim:#7a7286; --dim2:#a9a3b6;
  --acc:#a06cd5; --acc-fg:#ffffff; --inv-bg:#a06cd5; --inv-fg:#ffffff;
  --ok:#2f9e78; --bad:#d64570; --warn:#c98a1e;
  --okbg:rgba(47,158,120,.10); --badbg:rgba(214,69,112,.10);
  --f-head:'Space Grotesk','Noto Sans SC',sans-serif;
  --f-body:'Space Grotesk','Noto Sans SC',sans-serif; }
html[data-skin="pastel"] .status{background:linear-gradient(90deg,#ffe0f0 0 50%,#e0f0ff 50% 100%);
  border:0;border-radius:14px}
html[data-skin="pastel"] .status .track{background:rgba(255,255,255,.75)}
html[data-skin="pastel"] .track i{background:var(--acc)}
html[data-skin="pastel"] .sec{color:#3aa6a0;letter-spacing:.14em}
html[data-skin="pastel"] .sec::after{background:linear-gradient(90deg,#3aa6a0,#a06cd5);opacity:.45}
html[data-skin="pastel"] .card,
html[data-skin="pastel"] .hero-btn,
html[data-skin="pastel"] .status{border:0;border-radius:14px}
html[data-skin="pastel"] .card,
html[data-skin="pastel"] .hero-btn{box-shadow:0 8px 22px rgba(160,108,213,.18)}
html[data-skin="pastel"] .c3,
html[data-skin="pastel"] .item,
html[data-skin="pastel"] .param-panel,
html[data-skin="pastel"] .sk{border:0;border-radius:12px;
  box-shadow:0 3px 10px rgba(80,70,110,.08)}
html[data-skin="pastel"] .c3.on{background:#e0f7f5;color:var(--tx);box-shadow:0 6px 18px rgba(58,166,160,.25)}
html[data-skin="pastel"] .c3.on .ds,html[data-skin="pastel"] .c3.on .n{color:#1d6b66;opacity:.8}
html[data-skin="pastel"] .k4 div:nth-child(3),
html[data-skin="pastel"] .kpis div:last-child{background:#e0f7f5;color:#1d6b66}
html[data-skin="pastel"] .k4,html[data-skin="pastel"] .kpis{gap:6px;background:transparent;border:0}
html[data-skin="pastel"] .k4 div,html[data-skin="pastel"] .kpis div{border-radius:10px}

.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px 9px;
  background:transparent;border:2px solid var(--line);cursor:pointer;font:inherit;
  color:var(--dim);font-size:12px;font-weight:700;transition:.16s}
.sk .pv{width:100%;height:34px;border:2px solid;display:grid;place-items:center;transition:.16s}
.sk .pv i{width:15px;height:15px;border-radius:50%;display:block}
.sk:active{transform:scale(.97)}
.sk.on{border-color:var(--acc);color:var(--tx)}
.sk.on .pv{box-shadow:0 0 0 2px var(--acc)}



*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:var(--f-body);
  font-size:var(--fs); line-height:1.75; min-height:100vh; min-height:100dvh;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:contain; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 纸张纹理：极淡的横向纤维 */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 4px);
  -webkit-mask-image:radial-gradient(ellipse 100% 45% at 50% 0%,#000,transparent 75%);
  mask-image:radial-gradient(ellipse 100% 45% at 50% 0%,#000,transparent 75%);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
b,strong{font-weight:900}
code{font-family:var(--f-mono);background:var(--surf2);border:1px solid var(--line);
  padding:1px 5px;font-size:.88em}
/* 图标必须显式限尺寸：<svg> 无宽高默认会撑成 300x150，直接撑爆移动端布局 */
/* 默认尺寸兜底：<svg> 无宽高会被撑成 300x150，这已经坑过两次，这里一次性兜住 */
/* 收藏星：实心态必须用 class 覆盖，表现属性 fill= 打不过上面的 svg{fill:none} */
svg.faved{fill:currentColor;stroke:currentColor;color:var(--acc)}
#favBtn:active{transform:scale(.92)}
#favBtn{transition:transform .12s}
svg{display:block;flex:0 0 auto;width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.btn>svg{width:18px;height:18px}
.btn .ic svg{width:17px;height:17px}
.verdict .vt>svg{width:19px;height:19px;stroke-width:2.4}
.tabs svg{width:17px;height:17px;stroke-width:1.9}
.empty .mk svg{width:20px;height:20px;stroke-width:1.7}
.qtop .nav svg{width:16px;height:16px}

.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;
  padding:0 calc(20px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
@media(min-width:560px){.wrap{padding-left:26px;padding-right:26px}}

/* ---------- 顶部：红头文件 ---------- */
/* 顶部栏：品牌 + 导航 + 答题操作条全部固定在屏幕最上方，避免被浏览器/宿主底栏遮挡 */
.topbar{position:sticky;top:0;z-index:90;background:var(--bg);
  padding-top:env(safe-area-inset-top)}
.hdr{background:var(--hdr-bg,var(--acc));
  color:var(--hdr-fg,var(--acc-fg))}
.hdr .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:9px;
  padding:8px calc(18px + env(safe-area-inset-right)) 7px calc(18px + env(safe-area-inset-left))}
@media(min-width:560px){.hdr .in{padding-left:26px;padding-right:26px}}
.brand{display:flex;align-items:center;gap:9px;line-height:1}
.brand .mark{width:12px;height:12px;flex:0 0 auto;background:currentColor}
.brand .tx b{font-family:var(--f-head);font-weight:900;font-size:15px;letter-spacing:.16em}
.brand .tx small{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.22em;
  opacity:1;margin-top:3px;font-weight:400}
.spacer{flex:1}
.chip{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;
  background:var(--chip-bg,var(--inv-bg));color:var(--chip-fg,var(--inv-fg));
  padding:4px 9px;white-space:nowrap}
.chip.on{background:var(--chip-bg,var(--inv-bg));color:var(--chip-fg,var(--inv-fg))}

/* ---------- 底部导航 ---------- */
.tabs{background:var(--bg);border-bottom:2px solid var(--rule)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;
  grid-auto-flow:column;grid-auto-columns:1fr;   /* 跟随标签数量，不再写死 4 列 */
  min-height:var(--tabsh);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.tabs button{padding:6px 1px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;
  color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.02em;position:relative;
  min-width:0;white-space:nowrap}
.tabs button.on{color:var(--acc-fg);background:var(--acc)}
html[data-theme="dark"] .tabs button.on{color:var(--acc-fg);background:var(--acc)}
.badge{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;
  background:var(--bad);color:#fff;font-family:var(--f-mono);font-size:9px;line-height:16px;
  text-align:center;font-weight:600}

/* ---------- 通用块 ---------- */
.card{position:relative;background:var(--surf);border:2px solid var(--rule);padding:17px}
.card+.card{margin-top:14px}
.sec{font-family:var(--f-head);font-weight:900;font-size:12px;letter-spacing:.22em;
  color:var(--acc);margin:30px 0 12px;display:flex;align-items:center;gap:12px;line-height:1.4}
.sec::after{content:"";flex:1;height:2px;background:var(--rule);opacity:.22}
.mut{color:var(--dim)} .sm{font-size:.86em} .xs{font-size:.76em}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.stack>*+*{margin-top:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;
  min-height:54px;padding:12px 16px;background:var(--surf);border:2px solid var(--rule);
  color:var(--tx);font-family:var(--f-head);font-weight:900;font-size:16px;
  letter-spacing:.04em;text-align:center;transition:.12s;box-shadow:var(--sh)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);box-shadow:none}
.btn.pri:active{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.btn.dg{color:var(--bad);border-color:var(--bad);box-shadow:none}
.btn.sm{min-height:44px;padding:9px 13px;font-size:14px;box-shadow:none;font-family:var(--f-body)}
.btn.gh{background:transparent;box-shadow:none;border-width:2px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}

/* ---------- 首页 ---------- */
.hero{position:relative;background:var(--surf);border:2px solid var(--rule);
  padding:22px 20px 18px;overflow:hidden}
/* 斜切红块：构成主义签名 */
.hero::before{content:"";position:absolute;top:0;right:0;width:118px;height:118px;
  background:var(--acc);clip-path:polygon(100% 0,100% 100%,0 0);opacity:.14}
.hero::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:5px;background:var(--acc)}
.hero h1{font-family:var(--f-head);font-weight:900;font-size:calc(var(--fs) * 1.875);line-height:1.2;
  margin:0 0 12px;letter-spacing:-.012em}
.hero h1 .hl{color:var(--acc)}
.hero .sub{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;
  color:var(--dim);border-top:3px solid var(--rule);padding-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--rule);
  border:3px solid var(--rule);margin-top:20px}
.kpis div{background:var(--surf);padding:14px 4px;text-align:center}
.kpis div:last-child{background:var(--inv-bg);color:var(--inv-fg)}
.kpis b{display:block;font-family:var(--f-mono);font-size:calc(var(--fs) * 1.56);font-weight:600;
  line-height:1.2;font-variant-numeric:tabular-nums}
.kpis span{font-size:10.5px;letter-spacing:.1em;opacity:.75}
.ring{display:flex;align-items:center;gap:15px;margin-top:19px;padding-top:17px;
  border-top:3px solid var(--rule)}
.dial{width:58px;height:58px;flex:0 0 auto;display:grid;place-items:center;position:relative;
  border:2px solid var(--rule);
  background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surf2) 0)}
.dial::after{content:"";position:absolute;inset:6px;background:var(--surf)}
.dial b{position:relative;z-index:1;font-family:var(--f-mono);font-size:14px;font-weight:600}
.ring .rt b{display:block;font-family:var(--f-head);font-weight:900;font-size:15px}
.ring .rt span{font-size:12px;color:var(--dim)}

/* ---------- 答题 ---------- */
.qtop{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.qtop .nav{width:44px;height:44px;border:2px solid var(--rule);background:var(--surf);
  display:grid;place-items:center;flex:0 0 auto}
.qtop .nav[disabled]{opacity:.3}
.qtop .nav:not([disabled]):active{background:var(--acc);color:var(--acc-fg)}
.track{flex:1;height:10px;background:var(--surf2);border:2px solid var(--rule)}
.track i{display:block;height:100%;background:var(--acc);transition:width .3s cubic-bezier(.4,0,.2,1)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.count b{color:var(--tx);font-weight:600}

.tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:3px 8px;
  border:2px solid var(--rule);color:var(--dim)}
.tag.t1{color:var(--acc);border-color:var(--acc)}
.tag.t2{color:var(--inv-fg);background:var(--inv-bg);border-color:var(--inv-bg)}
.tag.t3{color:var(--warn);border-color:var(--warn)}
.tag.hot{color:var(--bad);border-color:var(--bad)}

.qcard{background:var(--surf);border:2px solid var(--rule);padding:19px 18px}
.stem{font-family:var(--f-head);font-weight:700;font-size:calc(var(--fs) * 1.19);
  line-height:1.85;margin:14px 0 20px;letter-spacing:.01em;word-break:break-word;
  text-wrap:pretty}
.stem .no{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;
  color:var(--acc);letter-spacing:.14em;margin-bottom:7px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:44px 1fr;align-items:stretch;text-align:left;
  background:var(--surf);border:2px solid var(--rule);min-height:58px;transition:.12s}
.opt .k{display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;
  font-size:15px;border-right:2px solid var(--rule);background:var(--surf2)}
.opt .v{padding:14px 15px;line-height:1.7;word-break:break-word;font-size:calc(var(--fs) * .97)}
.opt:active{background:var(--surf2)}
.opt.sel{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.opt.sel .k{background:var(--acc);color:var(--acc-fg);border-right-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:#fff;border-right-color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.no .k{background:var(--bad);color:#fff;border-right-color:var(--bad)}
.opt.lock{pointer-events:none}
.opt.dim{opacity:.42}

.verdict{margin-top:18px;border:3px solid var(--rule);background:var(--surf);padding:15px 16px;
  animation:rise .22s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict .vt{display:flex;align-items:center;gap:9px;font-family:var(--f-head);font-weight:900;
  font-size:calc(var(--fs) * 1.125);margin-bottom:9px;letter-spacing:.03em}
.verdict .vt.y{color:var(--ok)} .verdict .vt.n{color:var(--bad)}
.verdict .ans{font-family:var(--f-mono);font-size:12px;color:var(--dim);font-weight:500;
  letter-spacing:.04em}
.verdict .why{font-size:15px;line-height:1.72;border-top:2px solid var(--rule);padding-top:9px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.pill{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border:2px solid var(--rule);
  color:var(--dim)}
.pill.g{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.pill.r{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.pill.y{color:var(--warn);border-color:var(--warn)}
/* 暗色下浅绿底配白字只有 2.91:1，改深色字 */
html[data-theme="dark"] .opt.ok .k,
html[data-theme="dark"] .keys button.r{color:#141210}

/* 判定印章：红章方框 */
.stamp{position:fixed;left:50%;top:29%;width:132px;height:132px;margin:-66px 0 0 -66px;
  border:7px solid currentColor;display:grid;place-items:center;z-index:90;pointer-events:none;
  font-family:var(--f-head);font-weight:900;font-size:66px;line-height:1;opacity:0}
.stamp.go{animation:stamp .66s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes stamp{
  0%{opacity:0;transform:rotate(-11deg) scale(1.5)}
  26%{opacity:.96;transform:rotate(-11deg) scale(.93)}
  56%{opacity:.96;transform:rotate(-11deg) scale(1)}
  100%{opacity:0;transform:rotate(-11deg) scale(1.04)}
}
.stamp.y{color:var(--ok)} .stamp.n{color:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-6px)}
  38%{transform:translateX(6px)}58%{transform:translateX(-3px)}78%{transform:translateX(2px)}}
.shake{animation:shake .38s}

/* ---------- 底部操作条 ---------- */
.dock{background:var(--bg);border-top:2px solid var(--rule)}
.dock .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;
  padding:8px calc(18px + env(safe-area-inset-right)) 8px calc(18px + env(safe-area-inset-left))}
@media(min-width:560px){.dock .in{padding-left:26px;padding-right:26px}}
.dock .in>.btn{flex:1}

/* ---------- 清单 ---------- */
.item{border:2px solid var(--rule);background:var(--surf);padding:13px 14px;margin-bottom:10px;
  content-visibility:auto;contain-intrinsic-size:auto 108px}  /* 长错题本只渲染视口内的条目 */
.item .s{line-height:1.75;word-break:break-word;text-wrap:pretty}
.item .m{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px;
  font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.item .acts{display:flex;gap:9px;margin-top:11px}
.item .acts .btn{flex:1}

/* ---------- 统计 ---------- */
.k4{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;background:var(--rule);
  border:3px solid var(--rule)}
@media(min-width:520px){.k4{grid-template-columns:repeat(4,1fr)}}
.k4 div{background:var(--surf);padding:15px 6px;text-align:center}
.k4 div:nth-child(3){background:var(--acc);color:var(--acc-fg)}
.k4 b{display:block;font-family:var(--f-mono);font-size:calc(var(--fs) * 1.69);font-weight:600;line-height:1.15;
  font-variant-numeric:tabular-nums}
.k4 span{font-size:10.5px;letter-spacing:.08em;opacity:.78}
.bars{margin-top:2px}
.bar{display:grid;grid-template-columns:66px 1fr 56px;gap:11px;align-items:center;
  font-size:14px;padding:7px 0}
.bar .nm{color:var(--dim);font-size:12.5px}
.bar .bg{height:12px;background:var(--surf2);border:2px solid var(--rule)}
.bar .bg i{display:block;height:100%;background:var(--acc);transition:width .5s}
.bar .n{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:10px;padding-bottom:24px}
.spark div{flex:1;background:var(--surf2);border:2px solid var(--rule);position:relative;
  display:flex;align-items:flex-end;min-height:6px}
.spark div i{display:block;width:100%;background:var(--acc)}
.spark div span{position:absolute;bottom:-22px;left:-2px;right:-2px;text-align:center;
  font-family:var(--f-mono);font-size:9.5px;color:var(--dim)}

/* ---------- 表单 ---------- */
label.f{display:block;margin:17px 0 8px;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.14em;color:var(--dim)}
input[type=number],input[type=text],select,textarea{
  width:100%;background:var(--surf);border:2px solid var(--rule);color:var(--tx);
  padding:12px 13px;font:inherit;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=range]{width:100%;height:44px;padding:14px 0;accent-color:var(--acc)}
.sw{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:2px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .tx{flex:1;min-width:0}
.sw .tx .d{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.55}
.tg{flex:0 0 auto;width:48px;height:28px;background:var(--surf2);border:2px solid var(--rule);
  position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--dim);
  transition:.16s}
.tg.on{background:var(--acc);border-color:var(--acc)}
.tg.on::after{left:22px;background:var(--acc-fg)}
.tg::before{content:"";position:absolute;inset:-10px -8px}   /* 视觉不变，热区扩到 48x48 */
.seg{display:grid;grid-auto-flow:column;gap:3px;background:var(--rule);border:3px solid var(--rule)}
.seg button{background:var(--surf);padding:11px 4px;font-size:13.5px;font-weight:700;
  color:var(--dim);letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--acc-fg);font-weight:900}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;z-index:200;background:rgba(18,18,18,.62);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surf);border:3px solid var(--rule);width:100%;max-width:440px;
  padding:24px 24px 22px;box-shadow:6px 6px 0 rgba(18,18,18,.3);animation:rise .18s}
.modal h3{font-family:var(--f-head);font-weight:900;margin:0 0 9px;font-size:calc(var(--fs) * 1.25);
  letter-spacing:.02em;border-bottom:3px solid var(--acc);padding-bottom:9px;display:inline-block}
.sheet{position:fixed;inset:0;z-index:200;background:rgba(18,18,18,.62);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end}
.sheet .panel{background:var(--bg);border-top:3px solid var(--rule);width:100%;
  max-width:720px;margin:0 auto;padding:19px 20px calc(26px + env(safe-area-inset-bottom));
  max-height:84vh;max-height:84dvh;overflow:auto;overscroll-behavior:contain;
  animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:16px}
.keys button{position:relative;aspect-ratio:1;border:2px solid var(--rule);background:var(--surf);
  font-family:var(--f-mono);font-weight:600;font-size:14px;display:grid;place-items:center}
.keys button.r::after{content:"\2713";position:absolute;right:3px;bottom:1px;font-size:10px;line-height:1}
.keys button.w::after{content:"\2717";position:absolute;right:3px;bottom:1px;font-size:10px;line-height:1}
.keys button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.keys button.w{background:var(--bad);border-color:var(--bad);color:#fff}
.keys button.cur{outline:3px solid var(--warn);outline-offset:-5px}

/* ---------- 战报 ---------- */
.sum{text-align:center;padding:4px 2px 2px}
.sum .big{font-family:var(--f-mono);font-size:calc(var(--fs) * 3.6);font-weight:600;line-height:1;
  color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sum .lb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);
  margin-top:9px;text-transform:uppercase}
.sum .row4{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;background:var(--rule);
  border:3px solid var(--rule);margin:22px 0}
@media(min-width:480px){.sum .row4{grid-template-columns:repeat(4,1fr)}}
.sum .row4 div{background:var(--surf);padding:14px 5px}
.sum .row4 b{display:block;font-family:var(--f-mono);font-size:23px;font-weight:600;
  font-variant-numeric:tabular-nums}
.sum .row4 span{font-size:10.5px;color:var(--dim);letter-spacing:.06em}

/* ---------- 其他 ---------- */
.empty{text-align:center;padding:62px 20px;color:var(--dim)}
.empty .mk{width:56px;height:56px;margin:0 auto 18px;border:3px solid var(--rule);
  display:grid;place-items:center;background:var(--surf)}
.warnbar{border:3px solid var(--warn);background:var(--surf);padding:14px 15px;margin-bottom:14px}
.warnbar b{color:var(--warn);font-size:15px;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:300;background:var(--inv-bg);color:var(--inv-fg);
  padding:11px 20px;font-size:14px;font-weight:700;opacity:0;transition:.2s;
  pointer-events:none;max-width:86vw;text-align:center;border:2px solid var(--rule)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
.view{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- 首页：状态条 / 主按钮 / 模式胶囊 / 参数行 ---------- */
.status{background:var(--surf);border:2px solid var(--rule);padding:16px 18px;margin-bottom:16px}
.status .top{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.status .top b{font-family:var(--f-head);font-weight:900;font-size:calc(var(--fs) * 1.06);line-height:1.3}
.status .top span{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
.status .sub{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);margin-top:10px;
  display:flex;flex-wrap:wrap;gap:4px 12px}
.status .sub b{color:var(--tx);font-weight:600}
.status.examday{border-color:var(--acc);background:var(--acc);color:var(--acc-fg)}
.status.examday .top b,.status.examday .top span,.status.examday .sub{color:var(--acc-fg)}
.status.examday .track{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.5)}
.status.examday .track i{background:var(--acc-fg)}

.hero-btn{display:block;width:100%;text-align:left;background:var(--acc);color:var(--acc-fg);
  border:2px solid var(--rule);padding:20px;margin-bottom:22px;box-shadow:var(--sh);
  transition:.12s;font:inherit;cursor:pointer}
.hero-btn:active{transform:translate(2px,2px);box-shadow:none}
.hero-btn .t{display:block;font-family:var(--f-head);font-weight:900;
  font-size:calc(var(--fs) * 1.35);line-height:1.25;letter-spacing:.01em}
.hero-btn .s{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;
  margin-top:8px;opacity:.9;line-height:1.7}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{min-height:44px;padding:0 15px;display:inline-flex;align-items:center;gap:7px;
  background:var(--surf);border:2px solid var(--rule);font-family:var(--f-head);
  font-weight:700;font-size:14.5px;cursor:pointer;transition:.12s;color:var(--tx)}
.chip:active{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--acc)}
.chip:active .n{color:var(--acc-fg)}
.chip>svg{width:16px;height:16px}

.params{display:flex;gap:9px;margin-top:18px}
.pchip{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;border:1px dashed var(--line2,var(--line));color:var(--dim);
  font-size:13.5px;font-weight:700;font-family:var(--f-body);cursor:pointer}
.pchip.open{border-style:solid;border-color:var(--rule);color:var(--tx);background:var(--surf)}
.param-panel{margin-top:12px;background:var(--surf);border:2px solid var(--rule);padding:15px 16px}
.param-panel .lb{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--dim);
  margin-bottom:8px}
.param-panel .hint{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-top:11px}

/* ---------- 模拟考 ---------- */
.timer{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--acc);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.exam-res{text-align:center;padding:6px 2px}
.exam-res .score{font-family:var(--f-mono);font-size:calc(var(--fs) * 4.2);font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums}
.exam-res .verdict{display:inline-block;margin-top:12px;font-family:var(--f-head);font-weight:900;
  font-size:calc(var(--fs) * 1.2);padding:5px 16px;border:3px solid currentColor;letter-spacing:.1em}
.exam-res .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);margin-top:12px;
  letter-spacing:.08em}
.exam-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:14.5px}
.exam-row:last-child{border-bottom:0}
.exam-row .nm{flex:1}
.exam-row .sc{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.exam-row .bar2{width:96px;height:9px;background:var(--surf2);border:1px solid var(--line)}
.exam-row .bar2 i{display:block;height:100%;background:var(--acc)}

/* ---------- 开场说明弹窗 ---------- */
.intro-hd{background:var(--acc);color:var(--acc-fg);margin:-24px -24px 0;padding:18px 24px 15px;
  border-bottom:3px solid var(--rule)}
.intro-hd h3{color:var(--acc-fg);border:0;padding:0;margin:0;
  font-size:calc(var(--fs) * 1.15);letter-spacing:.08em}
.intro-bd{max-height:54vh;max-height:54dvh;overflow:auto;margin:18px 0 0;
  font-size:14.5px;line-height:1.9;overscroll-behavior:contain}
/* 分节：标签式标题 + 细分隔线，扫一眼就知道有几块 */
.intro-bd h4{font-family:var(--f-mono);font-weight:600;font-size:10.5px;letter-spacing:.22em;
  color:var(--acc);margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line);
  text-transform:uppercase}
.intro-bd h4:first-child{margin-top:0}
.intro-bd p{margin:0 0 9px;text-indent:0}
.intro-bd p:last-child{margin-bottom:0}
.intro-bd b{font-weight:900}
.intro-bd ul{padding:0;margin:0;list-style:none}
.intro-bd li{position:relative;padding-left:15px;margin:0 0 8px;line-height:1.85}
.intro-bd li:last-child{margin-bottom:0}
.intro-bd li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  background:var(--acc);border-radius:50%}
/* 整段都是名字的「鸣谢」条目，用悬挂缩进对齐更整齐 */
.intro-bd .who{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 9px}
.intro-bd .who b{grid-row:span 2;align-self:start;color:var(--acc)}
.intro-bd .who span{grid-column:2;font-size:13.5px;color:var(--dim)}
.intro-bd table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
.intro-bd th,.intro-bd td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.intro-bd th{background:var(--surf2);font-size:12px}
.intro-ft{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:15px;
  border-top:3px solid var(--rule)}
.intro-ft .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);cursor:pointer}
.intro-ft .box{width:22px;height:22px;border:2px solid var(--rule);display:grid;place-items:center;
  font-size:14px;line-height:1}
.intro-ft .box.on{background:var(--rule);color:var(--bg)}


/* ---------- 日常练习：3D 圆柱轮播（圆柱本身不可见） ---------- */
.carousel{position:relative;height:236px;margin:0 -20px;perspective:900px;
  perspective-origin:50% 42%;touch-action:pan-y;user-select:none}
.carousel .stage{position:absolute;left:50%;top:0;width:0;height:0;
  transform-style:preserve-3d;
  transition:transform .52s cubic-bezier(.22,.86,.26,1)}
.carousel.dragging .stage{transition:none}
.c3{position:absolute;left:-95px;top:12px;width:190px;height:166px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--surf);border:2px solid var(--rule);cursor:pointer;font:inherit;color:var(--tx);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:background .28s,border-color .28s,color .28s,box-shadow .28s}
.c3 .ic,.c3 .nm,.c3 .ds,.c3 .n{opacity:var(--dim,1);transition:opacity .28s}
.c3 .ic svg{width:32px;height:32px;stroke-width:1.7}
.c3 .nm{font-family:var(--f-head);font-weight:900;font-size:17.5px;letter-spacing:.02em;line-height:1}
.c3 .ds{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.03em;
  text-align:center;line-height:1.55;padding:0 12px}
.c3 .n{position:absolute;top:9px;right:10px;font-family:var(--f-mono);font-size:11px;
  font-weight:600;color:var(--acc)}
.c3.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);box-shadow:var(--sh)}
.c3.on .ds{color:var(--acc-fg);opacity:.88}
.c3.on .n{color:var(--acc-fg)}
.car-hint{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;
  font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border:1.5px solid var(--rule);cursor:pointer;transition:.2s}
.dots i.on{background:var(--acc);border-color:var(--acc);transform:scale(1.15)}

/* ---------- 动效优化 ---------- */
@media(prefers-reduced-motion:no-preference){
  .qcard{animation:qin .26s cubic-bezier(.22,.9,.3,1) both}
  @keyframes qin{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
  .opt{transition:background .12s,border-color .12s,transform .1s}
  .opt:active{transform:scale(.988)}
  .opt.ok,.opt.no{animation:mark .2s ease-out both}
  @keyframes mark{from{transform:scale(.985)}to{transform:none}}
  .btn,.chip,.pchip,.hero-btn{transition:transform .1s,background .14s,border-color .14s,color .14s,box-shadow .14s}
  .status .track i{transition:width .6s cubic-bezier(.22,.9,.3,1)}
  .dial{transition:background .6s ease}
}
@media(prefers-reduced-motion:reduce){
  .carousel .stage{transition:none}
}

pre.fmt{background:var(--surf2);border:2px solid var(--rule);padding:12px;overflow:auto;
  font-family:var(--f-mono);font-size:11.5px;line-height:1.6;margin:9px 0 0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--rule);opacity:.4}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>

<div class="topbar">
  <header class="hdr"><div class="in">
    <div class="brand">
      <span class="mark"></span>
      <span class="tx"><b>军事理论</b><small>DRILL TERMINAL</small></span>
    </div>
    <span class="spacer"></span>
    <span class="chip" id="hdrChip">240 题</span>
  </div></header>
  <nav class="tabs"><div class="in" id="tabs"></div></nav>
  <div class="dock" id="dock"></div>
</div>

<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="stamp" class="stamp"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ===========================================================================
   军事理论刷题 · 单文件应用

const mem = {};
let storeOK = true, storeWhy = "";
try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); }
catch (e) {
  storeOK = false;
  storeWhy = /sandbox|opaque|Security|denied/i.test(String(e.name) + e.message)
    ? "浏览器禁止了本地存储" : "浏览器禁用了本地存储";
}
function load(k, def) {
  if (!storeOK) return (k in mem) ? mem[k] : def;
  let raw = null;
  try { raw = localStorage.getItem(k); }
  catch (e) {                       // 存储本身不可用（沙箱 / 被禁用）
    storeOK = false;
    storeWhy = storeWhy || "浏览器禁止了本地存储";
    return (k in mem) ? mem[k] : def;
  }
  if (raw == null) return (k in mem) ? mem[k] : def;
  try { return JSON.parse(raw); }
  catch (e) {                       // 只是这一个键坏了：清掉它，不要拖累其它键的读写
    try { localStorage.removeItem(k); } catch (_) {}
    storeWhy = "本地数据损坏，已重置";
    return (k in mem) ? mem[k] : def;
  }
}
function save(k, v) {
  mem[k] = v;
  if (!storeOK) return;
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) { storeOK = false; storeWhy = "本地存储写入失败（可能空间已满）"; }
}

      const o = actx.createOscillator(), g = actx.createGain();

      const t0 = actx.currentTime + d;

      g.gain.exponentialRampToValueAtTime(ok ? .11 : .07, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .15);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + .18);
    });
  } catch (e) {}
}

/* ===========================================================================
   选 题 算 法
   无记忆曲线。核心是「反复刷」：错得越多越常出现，连对多了自动降频，
   没刷过的优先，错题本里的题加权最高。加权轮盘赌，组内不重复。
   =========================================================================== */
function weight(q) {
  const p = P(q.id);
  let w = 10;
  if (!p.seen) w += 26;                       // 没刷过 → 优先见一面
  w += Math.min(p.wrong, 8) * 11;             // 错误次数：主要权重来源
  if (p.inWrong) w += 34;                     // 错题本：最高优先
  if (p.fav) w += 16;                         // 收藏：你点名要重点看的
  w -= Math.min(p.streak, 6) * 3.2;           // 连对越多，出现越少
  if (p.lastAt) w += Math.min(14, (Date.now() - p.lastAt) / 86400000 * 2.2);  // 久没碰的提权
  w += Math.random() * 7;                     // 抖动，避免固定顺序
  return Math.max(1, w);
}
function pickWeighted(pool, n) {
  const rest = pool.slice(), out = [];
  while (out.length < n && rest.length) {
    const ws = rest.map(weight);
    let total = 0; for (const x of ws) total += x;
    let r = Math.random() * total, k = 0;
    for (; k < rest.length - 1; k++) { r -= ws[k]; if (r <= 0) break; }
    out.push(rest.splice(k, 1)[0]);
  }
  return out;
}
function scopeList() {
  if (cfg.scope === "single") return BANK.questions.filter(q => q.type === "single");
  if (cfg.scope === "multi")  return BANK.questions.filter(q => q.type === "multi");
  if (cfg.scope === "judge")  return BANK.questions.filter(q => q.type === "judge");
  return BANK.questions.slice();
}
const wrongList = () => BANK.questions.filter(q => P(q.id).inWrong);
const favList   = () => BANK.questions.filter(q => P(q.id).fav);
function toggleFav(id) { const p = P(id); p.fav = !p.fav; saveProg(); return p.fav; }
function buildSmart() {
  const pool = scopeList();
  const n = cfg.size === 0 ? pool.length : Math.min(cfg.size, pool.length);
  // 错题 + 收藏先占前 1/3 席位，剩下加权随机：保证「该刷的一定刷得到」
  const must = pool.filter(q => P(q.id).inWrong || P(q.id).fav);
  const rest = pool.filter(q => !(P(q.id).inWrong || P(q.id).fav));
  const head = pickWeighted(must, Math.min(must.length, Math.ceil(n / 3)));
  const tail = pickWeighted(rest, n - head.length);
  return shuffle(head.concat(tail));
}
function orderList() {                      // 顺序刷：从上次位置继续
  const pool = scopeList();
  if (!pool.length) return [];
  // 游标记「题目 id」而不是下标：切换刷题范围时位置不会错乱，题库增删也不会越界
  const lastId = load("mil.cursor", "");
  let start = pool.findIndex(q => q.id === lastId);
  if (start < 0) start = 0;
  const n = cfg.size === 0 ? pool.length : Math.min(cfg.size, pool.length);
  const out = [];
  for (let i = 0; i < n; i++) out.push(pool[(start + i) % pool.length]);
  // 游标不在这里推进：改成「边刷边推进」，中途退出下次能接着刷（见 next()）
  return out;
}
function randomList() {
  const pool = scopeList().slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, cfg.size === 0 ? pool.length : Math.min(cfg.size, pool.length));
}

/* ===========================================================================

const S = { mode: "", label: "", queue: [], i: 0, planned: 0, resolved: 0, frontier: 0,
            attempts: 0, correct: 0, sel: [], locked: false,
            first: {}, last: {}, chosen: {}, startAt: 0 };

function shuffleOpts(q) {
  if (!cfg.shuffle || q.type === "judge" || q.options.length < 2) return q;
  const idx = q.options.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return Object.assign({}, q, {
    options: idx.map(i => q.options[i]),
    answer: q.answer.map(a => idx.indexOf(a)).sort((x, y) => x - y)
  });
}

/* 点卡片会立刻渲染新页面；浏览器随后补发的 click 是按「当前 DOM」重新命中测试的，
   于是落在新页面上（用户感受就是「莫名其妙把第一题选了」）。吞掉紧随其后的那一次。 */
function swallowClick() {
  const h = ev => { ev.stopPropagation(); ev.preventDefault(); };
  document.addEventListener("click", h, true);

/* ---------------- 日常练习：3D 圆柱轮播 ---------------- */
let carRot = 0, carDrag = false;          // carRot 是连续角度（不取模），所以可以一直往一个方向转
const CAR_N = 5, CAR_DEG = 360 / CAR_N, CAR_R = 120;
const carIdxNow = () => ((Math.round(carRot / CAR_DEG) % CAR_N) + CAR_N) % CAR_N;

/* 顺序刷题的进度提示：让用户看到「接着哪刷」 */
function seqHint() {
  const pool = scopeList();
  const i = pool.findIndex(q => q.id === load("mil.cursor", ""));
  if (i <= 0) return "从第 1 题开始";
  return "接着第 " + (i + 1) + " 题";
}
function carModes() {
  const wn = wrongList().length;
  return [
    { id: "smart",  nm: "智能刷题", ds: "按错误次数抽题", ic: ICON.target },
    { id: "wrong",  nm: "错题重刷", ds: wn ? "错题本 " + wn + " 题" : "暂无错题", ic: ICON.repeat, n: wn || 0 },
    { id: "recite", nm: "背题模式", ds: "直接看答案", ic: ICON.layer },
    { id: "seq",    nm: "顺序刷题", ds: seqHint(), ic: ICON.book },
    { id: "random", nm: "随机刷题", ds: "打乱抽题", ic: ICON.shuffle }
  ];
}
function carouselHTML() {
  const ms = carModes();
  return '<div class="carousel" id="car">' +
    '<div class="stage" id="carStage" style="transform:rotateY(' + (-carRot) + 'deg)">' +
      ms.map((m, i) =>
        '<button type="button" class="c3" data-car="' + i + '" aria-label="' + esc(m.nm) + '"' +
        ' style="transform:rotateY(' + (i * CAR_DEG) + "deg) translateZ(" + CAR_R + 'px)">' +
          '<span class="ic">' + m.ic + "</span>" +
          '<span class="nm">' + m.nm + "</span>" +
          '<span class="ds">' + esc(m.ds) + "</span>" +
          (m.n ? '<span class="n">' + m.n + "</span>" : "") +
        "</button>").join("") +
    "</div></div>" +
    '<div class="car-hint"><span>滑动切换</span><span class="dots" id="carDots">' +
      ms.map((m, i) => '<i data-dot="' + i + '" class="' + (i === carIdxNow() ? "on" : "") + '"></i>').join("") +
    "</span><span>点击进入</span></div>";
}
function carApply() {
  const stage = $("#carStage");
  if (!stage) return;
  stage.style.transform = "rotateY(" + (-carRot) + "deg)";
  const cur = carIdxNow();
  $$("#car .c3").forEach((c, i) => {
    c.classList.toggle("on", i === cur);
    // 卡片相对正面的角度是 (i*72 - carRot)：stage 转的是 -carRot，符号别写反
    const a = ((i * CAR_DEG - carRot) % 360 + 540) % 360 - 180;          // -180..180
    const d = Math.abs(a);
    // 亮度作用在卡片内容上，不作用在卡片本身——否则 opacity 会把 3D 层拍平，遮挡关系就乱了
    if (carDrag) return;                 // 拖拽中不逐帧改透明度，松手吸附时统一算一次
    c.style.setProperty("--dim", d < 22 ? "1" : d > 100 ? "0" : (1 - (d - 22) / 78 * 0.5).toFixed(3));
  });
  $$("#carDots i").forEach((d, i) => d.className = i === cur ? "on" : "");
}
/* 把第 i 张转到正面，走最近的转向（不绕远路、也不回绕） */
function carSpinTo(i) {
  const cur = carIdxNow();
  let d = ((i - cur) % CAR_N + CAR_N) % CAR_N;
  if (d > CAR_N / 2) d -= CAR_N;
  carRot += d * CAR_DEG;
  carApply();
}
function bindCarousel() {
  const car = $("#car"), stage = $("#carStage");
  if (!car || !stage) return;
  carApply();
  $$("#carDots i").forEach(d => d.onclick = () => carSpinTo(Number(d.dataset.dot)));

  let sx = 0, sy = 0, moved = false, fromRot = 0, lastX = 0, lastY = 0, raf = 0, pendingX = 0, downHit = null;
  const paint = () => {
    raf = 0;
    stage.style.transform = "rotateY(" + (-(fromRot - (pendingX - sx) * 0.55)) + "deg)";
  };
  car.addEventListener("pointerdown", e => {
    carDrag = true; moved = false; sx = lastX = e.clientX; sy = lastY = e.clientY;
    fromRot = carRot; raf = 0;
    // 必须在 setPointerCapture 之前取：捕获之后所有指针事件的 target 都会变成 car
    downHit = e.target && e.target.closest ? e.target.closest("[data-car]") : null;
    car.classList.add("dragging");
    try { car.setPointerCapture(e.pointerId); } catch (_) {}
  });
  car.addEventListener("pointermove", e => {
    if (!carDrag) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    // 阈值从 7px 收紧到 5px：稍微一动就算滑动，避免手抖被当成点击而误进模式
    if (!moved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    if (!moved && Math.abs(dy) > Math.abs(dx)) { carDrag = false; car.classList.remove("dragging"); return; }
    moved = true; lastX = e.clientX; lastY = e.clientY; pendingX = e.clientX;
    if (!raf && typeof requestAnimationFrame === "function") raf = requestAnimationFrame(paint);
    else if (typeof requestAnimationFrame !== "function") paint();
  });
  const finish = e => {
    if (!carDrag) return;
    carDrag = false;
    if (raf && typeof cancelAnimationFrame === "function") cancelAnimationFrame(raf);
    raf = 0;
    car.classList.remove("dragging");
    void stage.offsetWidth;                       // 强制回流，让 transition 重新生效
    if (moved) {
      // 不做取模：角度持续累加，所以可以从第 5 张直接转到第 1 张而不会倒着甩一圈
      carRot = Math.round((fromRot - (lastX - sx) * 0.55) / CAR_DEG) * CAR_DEG;
      carApply();
      return;
    }
    const hit = downHit;                 // 用 pointerdown 时记住的那张，pointerup 的 target 已被捕获改写
    downHit = null;
    if (!hit) return;
    // 松手时再核一次真实位移：手指抖一下（>4px）就当作滑动，不触发进入
    if (Math.abs(lastX - sx) > 4 || Math.abs(lastY - sy) > 4) return;
    const i = Number(hit.dataset.car);
    if (i === carIdxNow()) {                       // 点正中的卡片才进入
      const m = carModes()[i];
      if (m.id === "wrong" && !wrongList().length) return toast("错题本是空的");
      swallowClick();                              // 先吞掉这次 click，再换页
      if (m.id === "smart") start("smart", buildSmart(), "智能刷题");
      else if (m.id === "wrong") start("wrong", wrongList(), "错题重刷");
      else if (m.id === "recite") startRecite(scopeList(), "背题模式");
      else if (m.id === "seq") start("seq", orderList(), "顺序刷题");
      else if (m.id === "random") start("random", randomList(), "随机刷题");

    } else { carSpinTo(i); }                       // 点两侧先把它转到正面（走最近方向）
  };
  car.addEventListener("pointerup", finish);
  car.addEventListener("pointercancel", finish);
  car.addEventListener("dragstart", e => e.preventDefault());
}

  S.i = 0; S.frontier = 0; S.planned = S.queue.length; S.resolved = 0;
  S.attempts = 0; S.correct = 0; S.sel = []; S.locked = false;
  S.first = {}; S.last = {}; S.startAt = Date.now();
  S.token = (S.token || 0) + 1; clearTimeout(S.timer);
  S._submitted = false; S._examResult = null;
  S.examEnd = cfg.examMinutes > 0 ? Date.now() + cfg.examMinutes * 60000 : 0;
  tickExam();

}
const examLeft = () => (S.examEnd ? S.examEnd - Date.now() : 0);
function fmtClock(ms) {
  if (ms <= 0) return "00:00";
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function tickExam() {
  if (typeof setInterval !== "function") return;      // 测试环境无定时器
  clearInterval(S.clock);
  S.clock = setInterval(() => {
    if (!isExam() || S._submitted) { clearInterval(S.clock); return; }
    const left = examLeft(), el = $("#examClock");
    if (el) { el.textContent = fmtClock(left); el.className = "timer" + (left < 300000 ? " low" : ""); }
    if (S.examEnd && left <= 0) { clearInterval(S.clock); submitExam(true); }
  }, 1000);
}

/* 交卷判分：多选错选不得分、漏选得 EXAM.multiPartial 分 */
function submitExam(auto) {
  if (!isExam() || S._submitted) return;
  S._submitted = true;
  if (typeof clearInterval === "function") clearInterval(S.clock);
  let got = 0, blank = 0;
  const wrong = [], byType = { single: [0, 0], judge: [0, 0], multi: [0, 0] };
  S.queue.forEach(it => {
    const q = it.q, sel = it.sel || [], full = EXAM.pt[q.type];
    let pts = 0;
    if (!sel.length) blank++;
    else {
      const bad = sel.some(i => !q.answer.includes(i));       // 错选
      const missed = q.answer.some(i => !sel.includes(i));    // 漏选
      if (!bad && !missed) pts = full;
      else if (q.type === "multi" && !bad && missed) pts = EXAM.multiPartial;
    }
    byType[q.type][0] += pts; byType[q.type][1] += full;
    got += pts;
    const ok = pts === full;
    applyAnswer(q, ok);
    if (!ok) wrong.push(q);
  });
  const ms = Date.now() - S.startAt;
  S._examResult = { got: got, byType: byType, wrong: wrong, blank: blank, ms: ms, auto: !!auto };
  const hist = examHistory(); hist.push({ d: dkey(), ts: Date.now(), got: got, ms: ms });
  save(K.exam, hist.slice(-40));
  S.i = S.queue.length;
  go("examResult");
}

function vExamResult() {

  const col = pass ? "var(--ok)" : "var(--acc)";
  const mm = Math.floor(r.ms / 60000), ss = Math.round((r.ms % 60000) / 1000);
  const row = (nm, g, tt) => '<div class="exam-row"><span class="nm">' + nm + "</span>" +
    '<span class="bar2"><i style="width:' + (tt ? g / tt * 100 : 0) + '%"></i></span>' +
    '<span class="sc">' + g + " / " + tt + "</span></div>";
  return '<div class="card"><div class="exam-res">' +
      '<div class="score" style="color:' + col + '">' + r.got + "</div>" +
      '<div class="meta">满分 ' + EXAM.total + " · 及格线 " + cfg.examPass + "</div>" +
      '<div class="verdict" style="color:' + col + '">' + (pass ? "通过" : "未通过") + "</div>" +
      '<div class="meta">' + (r.auto ? "时间到自动交卷 · " : "") +
        "用时 " + mm + " 分 " + ss + " 秒" + (r.blank ? " · 空着 " + r.blank + " 题" : "") + "</div>" +
    "</div></div>" +
    '<div class="card">' + row("单选题", r.byType.single[0], r.byType.single[1]) +
      row("判断题", r.byType.judge[0], r.byType.judge[1]) +
      row("多选题", r.byType.multi[0], r.byType.multi[1]) + "</div>" +
    '<div class="stack" style="margin-top:14px">' +
      (r.wrong.length ? '<button class="btn pri wide" data-e="wrong">重刷错题 ' + r.wrong.length + "</button>" : "") +
      '<button class="btn wide" data-e="again">再考一套</button>' +
      '<button class="btn gh wide" data-e="home">返回首页</button>' +
    "</div>";
}
function bindExamResult() {
  $$("#app [data-e]").forEach(b => b.onclick = () => {
    const a = b.dataset.e;
    if (a === "home") { S.queue = []; go("home"); }
    else if (a === "again") startExam();
    else if (a === "wrong") start("wrong", S._examResult.wrong, "模考错题");
  });
}

function applyAnswer(q, ok) {
  const p = P(q.id);
  p.seen++; p.lastAt = Date.now();
  if (ok) {
    p.right++; p.streak = Math.min(p.streak + 1, 99);
    if (p.inWrong) { p.ws++; if (p.ws >= 2) { p.inWrong = false; p.ws = 0; } }
  } else {
    p.wrong++; p.streak = 0; p.inWrong = true; p.ws = 0;
  }
  saveProg();
  const k = dkey();
  if (!daily || typeof daily !== "object" || Array.isArray(daily)) daily = {};
  const day = daily[k];
  if (!day || typeof day !== "object" || Array.isArray(day)) daily[k] = { n: 0, r: 0 };
  daily[k].n++; if (ok) daily[k].r++;
  saveDaily();
}

function pick(i) {
  if (S.locked || isRecite() || S._submitted) return;
  const it = cur();
  if (!it) return;
  const q = it.q;
  if (isExam()) {                      // 模拟考：只记录选择，交卷前不揭晓
    if (q.type === "multi") {          // 多选才累加/取消
      const k = it.sel.indexOf(i);
      k >= 0 ? it.sel.splice(k, 1) : it.sel.push(i);
      it.sel.sort((a, b) => a - b);
    } else {                           // 单选 / 判断：替换；再点同一项则取消
      it.sel = it.sel.length === 1 && it.sel[0] === i ? [] : [i];
    }
    $$("#app .opt").forEach((b, bi) => b.classList.toggle("sel", it.sel.includes(bi)));
    const c = $("#examCount");
    if (c) c.textContent = examAnswered() + "/" + S.queue.length;
    return;
  }
  if (it.answered) return;             // 回看态不可再作答（否则会二次计分、翻转判定）
  if (q.type === "multi") {
    const k = S.sel.indexOf(i);
    k >= 0 ? S.sel.splice(k, 1) : S.sel.push(i);
    S.sel.sort((a, b) => a - b);
    $$("#app .opt").forEach((b, bi) => b.classList.toggle("sel", S.sel.includes(bi)));
    const sb = $("#submit");
    if (sb) sb.disabled = !S.sel.length;
  } else { S.sel = [i]; judge(); }
}

function judge() {
  if (S.locked || isRecite() || isExam()) return;
  const it = cur();
  if (!it || it.answered) return;      // 同一条目只判一次
  const q = it.q;
  const ok = S.sel.length === q.answer.length && S.sel.every(v => q.answer.includes(v));
  S.locked = true; S.attempts++; if (ok) S.correct++;
  S.judgedAt = Date.now();
  // 作答状态存在「队列条目」上而不是按题目 id 存：同一道题在一组里出现两次
  //（原题 + 答错后的重做）时，重做必须仍然是可作答状态
  it.answered = true; it.sel = S.sel.slice(); it.ok = ok;
  S.frontier = Math.max(S.frontier, S.i);
  if (!(q.id in S.first)) S.first[q.id] = ok;
  S.last[q.id] = ok;

  applyAnswer(q, ok);
  beep(ok); stamp(ok);

  // 答错后重新排队：3~5 题后再考一次（记忆强化，非记忆曲线）
  if (!ok && S.mode !== "seq") {
    const rest = S.queue.length - S.i - 1;
    const gap = clamp(Math.ceil(rest / 2), 1, 5);
    S.queue.splice(Math.min(S.queue.length, S.i + 1 + gap), 0,
      { q: it.q, retry: true, answered: false, sel: [], ok: false, counted: false });
  }

  $$("#app .opt").forEach((b, i) => {
    b.classList.add("lock");
    b.classList.remove("sel");
    if (q.answer.includes(i)) b.classList.add("ok");
    else if (S.sel.includes(i)) { b.classList.add("no"); }
    else b.classList.add("dim");
  });
  if (!ok) { const c = $(".qcard"); if (c) { c.classList.add("shake"); setTimeout(() => c.classList.remove("shake"), 420); } }

  $("#fb").innerHTML = feedback(q, ok);
  const dock = $("#dock");
  dock.innerHTML = '<div class="in"><button class="btn pri wide" id="cont">' +
    (S.i + 1 >= S.queue.length ? "查看战报" : "继续") + " " + ICON.next + "</button></div>";
  // 双击「确认答案」的第二下会落在原位换成「继续」的同一个按钮上，短时间忽略
  $("#cont").onclick = () => { if (Date.now() - S.judgedAt < 260) return; next(); };
  clearTimeout(S.timer);
  if (ok && cfg.auto && S.mode !== "seq") {
    const at = S.i, tk = S.token;
    S.timer = setTimeout(() => {
      if (S.locked && S.i === at && S.token === tk) next();
    }, 780);
  }
}

function feedback(q, ok, recite) {
  const p = P(q.id);
  const right = q.type === "judge" ? (q.answer[0] === 0 ? "正确" : "错误")
                                   : q.answer.map(i => LET[i]).join("");
  const pills = [];
  if (ok && p.streak >= 3) pills.push('<span class="pill g">连对 ' + p.streak + " 次</span>");
  if (!ok && !recite) pills.push('<span class="pill r">已进错题本</span>');
  if (p.inWrong) pills.push('<span class="pill y">再对 ' + Math.max(0, 2 - p.ws) + " 次移出</span>");
  if (p.wrong > 1) pills.push('<span class="pill">错 ' + p.wrong + " 次</span>");

  const ansText = q.type === "judge" ? right
    : q.answer.map(i => LET[i] + ". " + q.options[i]).join("　");
  return '<div class="verdict">' +
    '<div class="vt y">' + ICON.check + (recite ? "正确答案" : (ok ? "回答正确" : "回答错误")) +
      '<span class="spacer"></span><span class="ans">' +
      (recite ? (q.type === "judge" ? "" : "正确选项 ") + esc(right) : "正确答案 " + esc(right)) +
      "</span></div>" +
    '<div class="why">' + esc(ansText) + "</div>" +
    (pills.length ? '<div class="pills">' + pills.join("") + "</div>" : "") +
  "</div>";
}

function next() {
  if (!S.locked) return;
  const it = cur();
  // 只统计一次：回看已答过的题再点「继续」不应重复计入进度
  if (it && !it.retry && !it.counted) { S.resolved++; it.counted = true; }
  S.locked = false; S.sel = [];
  S.i++;
  S.frontier = Math.max(S.frontier, S.i);
  // 顺序刷题：把游标推到当前题，下次进来接着刷
  if (S.mode === "seq" && S.queue[S.i]) save("mil.cursor", S.queue[S.i].q.id);
  window.scrollTo(0, 0);
  render();
}

let view = "home";

];

function go(v) {
  clearTimeout(S.timer);              // 离开答题页时作废未触发的自动跳转
  S.token = (S.token || 0) + 1;

function render() {
  const wn = wrongList().length;       // 一次算完，别在渲染热路径里重复全量扫描

      ask("离开本组练习？", "本组进度会丢失，已答记录保留。",
        () => { S.queue = []; go(k); }, "离开");

  const fn = { home: vHome, quiz: vQuiz, wrong: vWrong, stats: vStats, me: vMe,

  $("#app").innerHTML = '<div class="view">' + fn() + "</div>";

    else bindSummary();
  }
  if (view === "home") bindHome();
  if (view === "wrong") bindWrong();
  if (view === "me") bindMe();

}

    const fb2 = $("#favBtn");
    if (fb2) fb2.onclick = () => { const on = toggleFav(q.id);
      fb2.innerHTML = on ? ICON.starOn : ICON.star; toast(on ? "已收藏" : "已取消收藏"); };
    $("#sheetBtn").onclick = openSheet;
    const pv = $("#prev");
    if (pv) pv.onclick = () => { if (S.i > 0) { S.i--; window.scrollTo(0, 0); render(); } };
    const last = S.i + 1 >= S.queue.length;
    $("#dock").innerHTML = '<div class="in">' +
      '<button class="btn" id="rprev"' + (S.i === 0 ? " disabled" : "") + ">" + ICON.back + " 上一题</button>" +
      '<button class="btn pri" id="rnext">' + (last ? "背完了" : "下一题") + " " + ICON.next + "</button></div>";
    $("#rprev").onclick = () => { if (S.i > 0) { S.i--; window.scrollTo(0, 0); render(); } };
    $("#rnext").onclick = () => { S.i++; window.scrollTo(0, 0); render(); };
    return;
  }

  const done = !!it.answered;

  const pv = $("#prev");
  if (pv) pv.onclick = () => { if (S.i > 0) { S.i--; S.locked = false; S.sel = []; render(); } };
  const fb1 = $("#favBtn");
  if (fb1) fb1.onclick = () => { const on = toggleFav(q.id);
    fb1.innerHTML = on ? ICON.starOn : ICON.star; toast(on ? "已收藏" : "已取消收藏"); };
  $("#sheetBtn").onclick = openSheet;

  const dock = $("#dock");
  if (done) {                       // 回看已答题目：不重新作答
    const back = S.i !== S.frontier;
    dock.innerHTML = '<div class="in"><button class="btn pri wide" id="cont">' +
      (back ? "回到当前题" : (S.i + 1 >= S.queue.length ? "查看战报" : "继续")) + (back ? "" : " " + ICON.next) +
      "</button></div>";
    $("#cont").onclick = () => {
      if (back) { S.i = S.frontier; S.locked = false; S.sel = []; window.scrollTo(0, 0); render(); }
      else { S.locked = true; next(); }
    };
    return;
  }
  $$("#app .opt").forEach(b => b.onclick = () => pick(Number(b.dataset.i)));
  if (q.type === "multi") {
    dock.innerHTML = '<div class="in"><button class="btn pri wide" id="submit"' +
      (S.sel.length ? "" : " disabled") + ">确认答案</button></div>";
    $("#submit").onclick = judge;
    $$("#app .opt").forEach((b, i) => b.classList.toggle("sel", S.sel.includes(i)));
  } else {
    dock.innerHTML = "";
  }
}

function vSummary() {
  if (isRecite()) {                        // 背题没有对错，不套用正确率
    S._todo = [];
    return '<div class="card"><div class="sum">' +
      '<div class="big">' + S.planned + "</div>" +
      '<div class="lb">' + esc(S.label) + " · 已背题数</div>" +
      '<div class="row4">' +
        "<div><b>" + BANK.questions.filter(q => P(q.id).seen || P(q.id).recite).length +
          "</b><span>题库已覆盖</span></div>" +
        "<div><b>" + BANK.questions.length + "</b><span>题库总量</span></div>" +
      "</div></div>" +
      '<div class="stack">' +
        '<button class="btn pri wide" data-r="again">再背一遍</button>' +
        '<button class="btn wide" data-r="quiznow">直接开考</button>' +
        '<button class="btn gh wide" data-r="home">返回首页</button>' +
      "</div></div>";
  }
  const acc = S.attempts ? Math.round(S.correct / S.attempts * 100) : 0;
  const sec = Math.round((Date.now() - S.startAt) / 1000);
  const mm = Math.floor(sec / 60), ss = sec % 60;
  const firstOK = Object.keys(S.first).filter(k => S.first[k]).length;
  const miss = Object.keys(S.last).filter(k => !S.last[k]);
  const list = miss.map(id => BANK.questions.find(q => q.id === id)).filter(Boolean);
  S._miss = list;
  // 答题卡可以跳过中间题，战报必须如实反映「答了几题」而不是「发了几题」
  const todo = S.queue.filter(x => !x.answered).map(x => x.q);
  S._todo = todo;
  const answered = S.planned - todo.length;

  return '<div class="card"><div class="sum">' +
    '<div class="big">' + acc + "%</div>" +
    '<div class="lb">' + esc(S.label) + " · 正确率</div>" +
    '<div class="row4">' +
      "<div><b>" + answered + "/" + S.planned + "</b><span>已答/总题</span></div>" +
      "<div><b>" + firstOK + "</b><span>一次答对</span></div>" +
      "<div><b>" + miss.length + "</b><span>仍答错</span></div>" +
      "<div><b>" + mm + ":" + String(ss).padStart(2, "0") + "</b><span>用时</span></div>" +
    "</div></div>" +
    '<div class="stack">' +
      '<button class="btn pri wide" data-r="again">再来一组</button>' +
      (todo.length ? '<button class="btn wide" data-r="todo">补做 ' + todo.length + " 题</button>" : "") +
      (list.length ? '<button class="btn wide" data-r="miss">重刷错题 ' + list.length + "</button>" : "") +
      '<button class="btn gh wide" data-r="home">返回首页</button>' +
    "</div></div>";
}
function bindSummary() {
  $$("#app [data-r]").forEach(b => b.onclick = () => {
    const a = b.dataset.r;
    if (a === "home") { S.queue = []; go("home"); }
    else if (a === "miss") start("wrong", S._miss || [], "本轮错题");
    else if (a === "todo") start(S.mode || "smart", S._todo || [], "补做未答题");

/* ---------- 统计 ---------- */
function vStats() {
  const total = BANK.questions.length;
  let R = 0, W = 0, doneN = 0, recitedN = 0, wrong = 0;
  const byType = { single: [0, 0], multi: [0, 0], judge: [0, 0] };
  BANK.questions.forEach(q => {
    const p = P(q.id);
    R += p.right; W += p.wrong;
    if (p.seen) doneN++;
    if (p.recite) recitedN++;
    if (p.inWrong) wrong++;
    byType[q.type][0] += p.right; byType[q.type][1] += p.right + p.wrong;
  });
  const acc = (R + W) ? Math.round(R / (R + W) * 100) : 0;

  let h = '<div class="k4">' +
    "<div><b>" + R + "</b><span>累计答对</span></div>" +
    "<div><b>" + W + "</b><span>累计答错</span></div>" +
    "<div><b>" + acc + "%</b><span>总正确率</span></div>" +
    "<div><b>" + doneN + "/" + total + "</b><span>已答过</span></div>" +
    "<div><b>" + recitedN + "</b><span>背过</span></div>" +
  "</div>";

  h += '<h2 class="sec">分题型正确率</h2><div class="card"><div class="bars">' +
    [["single", "单选题"], ["multi", "多选题"], ["judge", "判断题"]].map(([k, nm]) => {
      const [r, t] = byType[k];
      const pc = t ? Math.round(r / t * 100) : 0;
      return '<div class="bar"><span class="nm">' + nm + "</span>" +
        '<span class="bg"><i style="width:' + pc + '%"></i></span>' +
        '<span class="n">' + (t ? pc + "%" : "—") + "</span></div>";
    }).join("") + "</div></div>";

  // 最近 7 天
  const days = [];
  const now = new Date(); now.setHours(0, 0, 0, 0);
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);   // 不能用毫秒减：跨夏令时会丢一天
    days.push({ d, n: (daily[dkey(d)] || {}).n || 0 });
  }
  const mx = Math.max(1, ...days.map(x => x.n));
  h += '<h2 class="sec">最近 7 天</h2><div class="card">' +
    '<div class="spark">' + days.map(x =>
      '<div title="' + dkey(x.d) + "：" + x.n + ' 题"><i style="height:' +
      Math.max(2, x.n / mx * 52) + 'px"></i><span>' + (x.d.getMonth() + 1) + "/" + x.d.getDate() + "</span></div>"
    ).join("") + "</div></div>";

  const hot = BANK.questions.filter(q => P(q.id).wrong > 0)
    .sort((a, b) => P(b.id).wrong - P(a.id).wrong).slice(0, 10);
  if (hot.length) {
    h += '<h2 class="sec">最常错的题</h2><div class="card">';
    hot.forEach(q => {
      h += '<div class="item"><div class="s">' + esc(q.stem.length > 60 ? q.stem.slice(0, 60) + "…" : q.stem) + "</div>" +
        '<div class="m"><span class="pill r">错 ' + P(q.id).wrong + " 次</span>" +
        '<span class="pill">' + (q.type === "single" ? "单选" : q.type === "multi" ? "多选" : "判断") + "</span></div></div>";
    });
    h += "</div>";
  }

  h += '<div style="margin-top:18px"><button class="btn dg wide" id="resetBtn">清空全部刷题记录</button></div>';
  return h;
}
function bindStats() {
  const b = $("#resetBtn");
  if (b) b.onclick = () => ask("清空刷题记录？", "错题本和统计清空，题库保留。", () => {
    prog = {}; daily = {}; saveProg(); saveDaily(); save("mil.cursor", 0);

  };

  });
  const fr = $("#fontRange");
  fr.oninput = () => { cfg.font = Number(fr.value); applyFont(); $("label.f").textContent = "字号 · " + cfg.font + "px"; };
  fr.onchange = saveCfg;
  $("#expBtn").onclick = () => {
    const text = JSON.stringify({ app: "军事理论刷题", v: 1, prog, daily, cfg }, null, 1);
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      a.download = "刷题记录-" + dkey() + ".json";
      document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 3000);
      toast("已导出");
    } catch (e) { say("备份内容", '<pre class="fmt">' + esc(text.slice(0, 4000)) + "</pre>", "关闭"); }
  };
  const ib = $("#introBtn");
  if (ib) ib.onclick = () => openIntro(true);
  $("#impBtn").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(String(rd.result));
          if (!d || typeof d !== "object") { toast("文件格式不对"); return; }
          // 只接受形状正确的数据；cfg 只白名单合并，避免 __proto__ 之类污染原型
          if (d.prog && typeof d.prog === "object" && !Array.isArray(d.prog)) { prog = d.prog; saveProg(); }
          if (d.daily && typeof d.daily === "object" && !Array.isArray(d.daily)) {
            const clean = {};                       // 只收形状正确的日期条目
            Object.keys(d.daily).forEach(k => {
              const v = d.daily[k];
              if (v && typeof v === "object" && !Array.isArray(v) && Number.isFinite(v.n)) {
                clean[k] = { n: v.n, r: Number.isFinite(v.r) ? v.r : 0 };
              }
            });
            daily = clean; saveDaily();
          }
          if (d.cfg && typeof d.cfg === "object" && !Array.isArray(d.cfg)) {
            const src = d.cfg;
            ["theme", "skin", "sound", "auto", "shuffle", "scope", "examDate"].forEach(k => {
              if (typeof src[k] === "string" || typeof src[k] === "boolean") cfg[k] = src[k];
            });
            ["font", "size", "examPass", "examMinutes"].forEach(k => {
              if (Number.isFinite(src[k])) cfg[k] = src[k];
            });
            sanitizeCfg();
            saveCfg(); applyTheme(); applyFont();
          }
          toast("已恢复"); render();
        } catch (e) { toast("文件格式不对"); }
      };
      rd.readAsText(f, "utf-8");
    };
    inp.click();
  };
}

function emptyBlock(t, s) {
  return '<div class="empty"><div class="mk">' + ICON.empty + "</div>" +
    '<div style="font-weight:700;color:var(--tx)">' + esc(t) + "</div>" +
    '<div class="sm" style="margin-top:5px">' + esc(s) + "</div></div>";
}

/* ===========================================================================
   主题 / 键盘 / 启动
   =========================================================================== */
function applyTheme() {
  const s = skinOf(cfg.skin);
  document.documentElement.setAttribute("data-skin", s.id);
  document.documentElement.setAttribute("data-theme", s.theme);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", s.bg);
}
function applyFont() {
  cfg.font = clamp(Number(cfg.font) || 16, 14, 21);
  document.documentElement.style.setProperty("--fs", cfg.font + "px");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); return; }
  if ($("#modal").innerHTML) return;   // 弹层开着时键盘不作用于背后的题目
  if (view !== "quiz" || S.i >= S.queue.length) return;
  if (!cur() || cur().answered) return; // 回看态不接受作答按键
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === "Enter" || k === " ") {
    e.preventDefault();
    if (S.locked) { const c = $("#cont"); if (c) c.click(); }
    else { const s = $("#submit"); if (s && !s.disabled) s.click(); }
    return;
  }
  if (isRecite()) {                    // 背题模式：左右键翻页，不接受作答键
    if (k === "ArrowLeft") { const p = $("#rprev"); if (p && !p.disabled) p.click(); }
    else if (k === "ArrowRight" || k === "Enter" || k === " ") { e.preventDefault(); const n = $("#rnext"); if (n) n.click(); }
    return;
  }
  if (isExam()) {
    if (k === "ArrowLeft")  { const p = $("#eprev"); if (p && !p.disabled) p.click(); }
    else if (k === "ArrowRight") { const n = $("#enext"); if (n && !n.disabled) n.click(); }
    else {
      let ei = -1;
      if (/^[a-hA-H]$/.test(k)) ei = k.toUpperCase().charCodeAt(0) - 65;
      else if (/^[1-8]$/.test(k)) ei = Number(k) - 1;
      if (ei >= 0 && ei < cur().q.options.length) pick(ei);
    }
    return;
  }
  if (k === "ArrowLeft") { const p = $("#prev"); if (p && !p.disabled) p.click(); return; }
  let i = -1;
  if (/^[a-hA-H]$/.test(k)) i = k.toUpperCase().charCodeAt(0) - 65;
  else if (/^[1-8]$/.test(k)) i = Number(k) - 1;
  if (i >= 0 && i < cur().q.options.length) pick(i);
});

// 视图切换时清掉底部操作条
applyTheme();
applyFont();
render();
// 首次打开弹出「开发者的话」（可勾选「不再显示」，设置里也能再打开）
if (!load("mil.intro.v1", false)) setTimeout(() => openIntro(), 120);
</script>
